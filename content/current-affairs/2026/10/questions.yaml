  stem:
    en: The 2026 Nobel Memorial Prize in Economic Sciences was awarded "for microeconomic foundations of macroeconomic stabilisation" to which pair?
    bn: '"সামষ্টিক অর্থনৈতিক স্থিতিশীলতার ব্যষ্টিক অর্থনৈতিক ভিত্তি"-র জন্য ২০২৬ সালের অর্থনীতিতে নোবেল কোন দুজন পেয়েছেন?'
  options:
    - { en: Robert E. Hall and Michael Woodford, bn: রবার্ট ই. হল ও মাইকেল উডফোর্ড }
    - { en: Francis Halzen and Michael Woodford, bn: ফ্রান্সিস হালজেন ও মাইকেল উডফোর্ড }
    - { en: Robert E. Hall and Karl Deisseroth, bn: রবার্ট ই. হল ও কার্ল ডাইসারথ }
    - { en: Henri B. Kagan and Kensō Soai, bn: অঁরি বি. কাগান ও কেনসো সোয়াই }
  answer: 0
  explanation:
    en: Robert E. Hall (Stanford) and Michael Woodford (Columbia) shared the prize, announced on 12 October 2026. Halzen won the Physics prize; Kagan and Soai won Chemistry.
    bn: রবার্ট ই. হল (স্ট্যানফোর্ড) ও মাইকেল উডফোর্ড (কলম্বিয়া) যৌথভাবে পুরস্কারটি পান; ঘোষণা ১২ অক্টোবর ২০২৬। হালজেন পদার্থবিদ্যায় এবং কাগান ও সোয়াই রসায়নে নোবেল পেয়েছেন।
  status: ai-generated
  as_of: "2026-10-12"
  source: https://www.nobelprize.org/prizes/economic-sciences/2026/press-release/

