- id: q0005
  type: single
  difficulty: 1
  exams: [ssc-cgl, ssc-chsl, wbcs]
  refs: [i003]
  stem:
    en: The 2026 Nobel Prize in Physiology or Medicine was awarded for work on which subject?
    bn: ২০২৬ সালের চিকিৎসাবিজ্ঞানে নোবেল পুরস্কার কোন বিষয়ে কাজের জন্য দেওয়া হয়েছে?
  options:
    - { en: mRNA vaccines, bn: এমআরএনএ টিকা }
    - { en: Light-gated ion channels and optogenetics, bn: আলো-নিয়ন্ত্রিত আয়ন চ্যানেল ও অপটোজেনেটিক্স }
    - { en: CRISPR gene editing, bn: ক্রিসপার জিন সম্পাদনা }
    - { en: High-energy astrophysical neutrinos, bn: উচ্চশক্তির মহাজাগতিক নিউট্রিনো }
  answer: 1
  explanation:
    en: Karl Deisseroth, Peter Hegemann and Georg Nagel were honoured for light-gated ion channels and optogenetics. High-energy neutrinos (IceCube) was the subject of the Physics prize.
    bn: আলো-নিয়ন্ত্রিত আয়ন চ্যানেল ও অপটোজেনেটিক্সের জন্য কার্ল ডাইসারথ, পিটার হেগেমান ও গেয়র্গ নাগেল সম্মানিত হয়েছেন। উচ্চশক্তির নিউট্রিনো (আইসকিউব) ছিল পদার্থবিদ্যার নোবেলের বিষয়।
  status: ai-generated
  as_of: "2026-10-31"
  source: https://www.nobelprize.org/all-nobel-prizes-2026/

- id: q0006
  type: single
  difficulty: 2
  exams: [upsc-cse, wbcs, state-psc]
  refs: [i004]
  stem:
    en: The Pradhan Mantri Viksit Gram Swaraj Yojana, approved by the Union Cabinet on 28 October 2026, mainly aims to strengthen which of the following?
    bn: ২৮ অক্টোবর ২০২৬ কেন্দ্রীয় মন্ত্রিসভার অনুমোদিত প্রধানমন্ত্রী বিকশিত গ্রাম স্বরাজ যোজনার মূল লক্ষ্য নিম্নলিখিত কোনটিকে শক্তিশালী করা?
  options:
    - { en: Urban local bodies, bn: শহুরে স্থানীয় সংস্থা }
    - { en: Rural cooperative banks, bn: গ্রামীণ সমবায় ব্যাংক }
    - { en: Panchayats and rural local governance, bn: পঞ্চায়েত ও গ্রামীণ স্থানীয় স্বশাসন }
    - { en: Self-help groups for women, bn: মহিলাদের স্বনির্ভর গোষ্ঠী }
  answer: 2
  explanation:
    en: PM-VGSY is a Centrally Sponsored Scheme (2026-27 to 2030-31, ₹7,395.55 crore) to strengthen Panchayats and rural local governance, covering more than 2.55 lakh Panchayats and traditional local bodies.
    bn: PM-VGSY একটি কেন্দ্রীয়ভাবে প্রবর্তিত প্রকল্প (২০২৬-২৭ থেকে ২০৩০-৩১, ৭,৩৯৫.৫৫ কোটি টাকা), যার উদ্দেশ্য পঞ্চায়েত ও গ্রামীণ স্থানীয় স্বশাসন শক্তিশালী করা; ২.৫৫ লক্ষেরও বেশি পঞ্চায়েত ও প্রথাগত স্থানীয় সংস্থা এর আওতায়।
  status: ai-generated
  as_of: "2026-10-28"
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329692

- id: q0007
  type: single
  difficulty: 2
  exams: [ssc-cgl, rrb-ntpc, wbcs]
  refs: [i005]
  stem:
    en: NVS-03, launched by ISRO's GSLV-F18 on 30 October 2026, belongs to which kind of satellite system?
    bn: ৩০ অক্টোবর ২০২৬ ইসরোর জিএসএলভি-এফ১৮ দ্বারা উৎক্ষেপিত এনভিএস-০৩ কোন ধরনের উপগ্রহ ব্যবস্থার অংশ?
  options:
    - { en: Earth observation, bn: ভূ-পর্যবেক্ষণ }
    - { en: Communication, bn: যোগাযোগ }
    - { en: Navigation (IRNSS / NavIC), bn: নেভিগেশন (IRNSS / NavIC) }
    - { en: Weather (meteorology), bn: আবহাওয়া }
  answer: 2
  explanation:
    en: NVS-03 is the third satellite of ISRO's next-generation navigation (NVS) series, which provides continuity of the IRNSS (NavIC) navigation service.
    bn: এনভিএস-০৩ ইসরোর পরবর্তী প্রজন্মের নেভিগেশন (NVS) সিরিজের তৃতীয় উপগ্রহ, যা IRNSS (NavIC) নেভিগেশন পরিষেবার ধারাবাহিকতা বজায় রাখে।
  status: ai-generated
  as_of: "2026-10-31"
  source: https://www.isro.gov.in/Mission_GSLVF18.html

- id: q0008
  type: assertion-reason
  difficulty: 3
  exams: [upsc-cse, wbcs]
  refs: [i005]
  assertion:
    en: NVS-03 carries an indigenous atomic clock.
    bn: এনভিএস-০৩-এ দেশে তৈরি পারমাণবিক ঘড়ি রয়েছে।
  reason:
    en: Satellite navigation systems determine position from precisely timed signals, so accurate onboard clocks are essential.
    bn: উপগ্রহ নেভিগেশন ব্যবস্থা নিখুঁত সময়ের সংকেত থেকে অবস্থান নির্ণয় করে, তাই উপগ্রহে নির্ভুল ঘড়ি অপরিহার্য।
  answer: 0
  explanation:
    en: Both are true and R explains A. Navigation satellites broadcast time-stamped signals; receivers compute position from signal travel times, which needs very accurate (atomic) clocks.
    bn: দুটি বক্তব্যই সত্য এবং R হলো A-এর সঠিক ব্যাখ্যা। নেভিগেশন উপগ্রহ সময়-চিহ্নিত সংকেত পাঠায়; গ্রাহক যন্ত্র সংকেতের যাত্রাকাল থেকে অবস্থান নির্ণয় করে, যার জন্য অত্যন্ত নির্ভুল (পারমাণবিক) ঘড়ি প্রয়োজন।
  status: ai-generated
  as_of: "2026-10-31"
  source: https://www.isro.gov.in/Mission_GSLVF18.html
