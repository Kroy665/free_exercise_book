  stem:
    en: In October 2026, the RBI changed the policy repo rate to what level?
    bn: অক্টোবর ২০২৬-এ রিজার্ভ ব্যাংক নীতিগত রেপো রেট কত করেছে?
  options:
    - { en: "5.25%", bn: "৫.২৫%" }
    - { en: "5.50%", bn: "৫.৫০%" }
    - { en: "5.75%", bn: "৫.৭৫%" }
    - { en: "6.00%", bn: "৬.০০%" }
  answer: 1
  explanation:
    en: The MPC raised the repo rate by 25 basis points, from 5.25% to 5.50%, at its meeting of 5–7 October 2026.
    bn: ৫–৭ অক্টোবর ২০২৬-এর বৈঠকে MPC রেপো রেট ২৫ বেসিস পয়েন্ট বাড়িয়ে ৫.২৫% থেকে ৫.৫০% করে।
  status: ai-generated
  as_of: "2026-10-07"
  source: https://rbi.org.in/scripts/BS_PressReleaseDisplay.aspx?prid=63744

- id: q0002
  type: statements
  difficulty: 2
  exams: [upsc-cse, ibps-po, wbcs]
  refs: [i001]
  stem:
    en: Consider the following statements about the RBI's monetary policy decision of October 2026.
    bn: অক্টোবর ২০২৬-এ রিজার্ভ ব্যাংকের মুদ্রানীতি সিদ্ধান্ত সম্পর্কে নিম্নলিখিত বিবৃতিগুলি বিবেচনা করুন।
  statements:
    - en: "1. The repo rate was increased by 25 basis points."
      bn: "১. রেপো রেট ২৫ বেসিস পয়েন্ট বাড়ানো হয়েছিল।"
    - en: "2. The policy stance was changed to \"calibrated tightening\"."
      bn: "২. নীতিগত অবস্থান বদলে \"পরিমিত কঠোরতা\" (calibrated tightening) করা হয়েছিল।"
    - en: "3. It was the first repo rate cut since February 2023."
      bn: "৩. এটি ছিল ফেব্রুয়ারি ২০২৩-এর পর প্রথম রেপো রেট হ্রাস।"
  question:
    en: Which of the statements given above is/are correct?
    bn: উপরের কোন বিবৃতিটি/বিবৃতিগুলি সঠিক?
  options:
    - { en: 1 only, bn: কেবল ১ }
    - { en: 1 and 2 only, bn: কেবল ১ ও ২ }
    - { en: 2 and 3 only, bn: কেবল ২ ও ৩ }
    - { en: "1, 2 and 3", bn: "১, ২ ও ৩" }
  answer: 1
  explanation:
    en: Statements 1 and 2 are correct. Statement 3 is wrong; it was the first repo rate increase (not a cut) since February 2023.
    bn: ১ ও ২ নং বিবৃতি সঠিক। ৩ নং বিবৃতি ভুল; এটি ছিল ফেব্রুয়ারি ২০২৩-এর পর প্রথম রেপো রেট বৃদ্ধি (হ্রাস নয়)।
  status: ai-generated
  as_of: "2026-10-07"
  source: https://rbi.org.in/scripts/BS_PressReleaseDisplay.aspx?prid=63744

- id: q0003
