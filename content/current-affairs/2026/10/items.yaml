- id: i004
  date: "2026-10-28"
  category: schemes
  title:
    en: Cabinet approves Pradhan Mantri Viksit Gram Swaraj Yojana
    bn: মন্ত্রিসভার অনুমোদন পেল প্রধানমন্ত্রী বিকশিত গ্রাম স্বরাজ যোজনা
  body:
    en: On 28 October 2026 the Union Cabinet approved the Pradhan Mantri Viksit Gram Swaraj Yojana (PM-VGSY) as a Centrally Sponsored Scheme for 2026-27 to 2030-31, with a total outlay of ₹7,395.55 crore (Centre ₹4,869.48 crore; States ₹2,526.07 crore). It aims to strengthen Panchayats and rural local governance, and is expected to benefit about 32 lakh elected representatives, Panchayat functionaries and other stakeholders across more than 2.55 lakh Panchayats and traditional local bodies.
    bn: ২৮ অক্টোবর ২০২৬ কেন্দ্রীয় মন্ত্রিসভা প্রধানমন্ত্রী বিকশিত গ্রাম স্বরাজ যোজনা (PM-VGSY)-কে ২০২৬-২৭ থেকে ২০৩০-৩১ সময়কালের জন্য কেন্দ্রীয়ভাবে প্রবর্তিত প্রকল্প হিসেবে অনুমোদন দেয়। মোট ব্যয় ৭,৩৯৫.৫৫ কোটি টাকা (কেন্দ্র ৪,৮৬৯.৪৮ কোটি; রাজ্য ২,৫২৬.০৭ কোটি)। প্রকল্পের লক্ষ্য পঞ্চায়েত ও গ্রামীণ স্থানীয় স্বশাসন শক্তিশালী করা; ২.৫৫ লক্ষেরও বেশি পঞ্চায়েত ও প্রথাগত স্থানীয় সংস্থার প্রায় ৩২ লক্ষ নির্বাচিত প্রতিনিধি, পঞ্চায়েত কর্মী ও অন্যান্য অংশীদার এতে উপকৃত হবেন।
  key_points:
    - { en: "Type: Centrally Sponsored Scheme, 2026-27 to 2030-31", bn: "ধরন: কেন্দ্রীয়ভাবে প্রবর্তিত প্রকল্প, ২০২৬-২৭ থেকে ২০৩০-৩১" }
    - { en: "Outlay: ₹7,395.55 crore", bn: "ব্যয়: ৭,৩৯৫.৫৫ কোটি টাকা" }
    - { en: "Period matches the Sixteenth Finance Commission cycle", bn: "সময়কাল ষোড়শ অর্থ কমিশনের মেয়াদের সঙ্গে মিলে যায়" }
  related_topics: []
  source: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2329692
