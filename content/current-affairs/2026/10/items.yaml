- id: i005
  date: "2026-10-30"
  category: science
  title:
    en: ISRO's GSLV-F18 launches navigation satellite NVS-03
    bn: ইসরোর জিএসএলভি-এফ১৮ উৎক্ষেপণ করল নেভিগেশন উপগ্রহ এনভিএস-০৩
  body:
    en: On 30 October 2026 ISRO's GSLV-F18 lifted off from the Second Launch Pad at the Satish Dhawan Space Centre (SDSC SHAR), Sriharikota, and placed the NVS-03 satellite in its intended transfer orbit. NVS-03 is the third satellite of ISRO's next-generation navigation satellite (NVS) series, meant to ensure continuity of the IRNSS (NavIC) navigation service. It carries an indigenous atomic clock. The mission was the 20th flight of the GSLV.
    bn: ৩০ অক্টোবর ২০২৬ ইসরোর জিএসএলভি-এফ১৮ শ্রীহরিকোটার সতীশ ধাওয়ান মহাকাশ কেন্দ্রের (SDSC SHAR) দ্বিতীয় উৎক্ষেপণ মঞ্চ থেকে যাত্রা করে এবং এনভিএস-০৩ উপগ্রহকে নির্ধারিত স্থানান্তর কক্ষপথে স্থাপন করে। এনভিএস-০৩ ইসরোর পরবর্তী প্রজন্মের নেভিগেশন উপগ্রহ (NVS) সিরিজের তৃতীয় উপগ্রহ, যার উদ্দেশ্য IRNSS (NavIC) নেভিগেশন পরিষেবা অব্যাহত রাখা। এতে দেশে তৈরি পারমাণবিক ঘড়ি রয়েছে। এটি ছিল জিএসএলভি-র ২০তম উড়ান।
  key_points:
    - { en: "Launch: 30 October 2026, Second Launch Pad, Sriharikota", bn: "উৎক্ষেপণ: ৩০ অক্টোবর ২০২৬, দ্বিতীয় উৎক্ষেপণ মঞ্চ, শ্রীহরিকোটা" }
    - { en: "NVS series replaces/continues the IRNSS (NavIC) constellation", bn: "NVS সিরিজ IRNSS (NavIC) ব্যবস্থার ধারাবাহিকতা রক্ষা করে" }
    - { en: "20th flight of GSLV", bn: "জিএসএলভি-র ২০তম উড়ান" }
  related_topics: []
  source: https://www.isro.gov.in/Mission_GSLVF18.html
