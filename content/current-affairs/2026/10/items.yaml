- id: i001
  date: "2026-10-07"
  category: economy
  title:
    en: RBI raises repo rate by 25 basis points to 5.50%
    bn: রিজার্ভ ব্যাংক রেপো রেট ২৫ বেসিস পয়েন্ট বাড়িয়ে ৫.৫০% করল
  body:
    en: The Monetary Policy Committee (MPC) of the Reserve Bank of India, which met from 5 to 7 October 2026, unanimously raised the policy repo rate under the Liquidity Adjustment Facility (LAF) by 25 basis points, from 5.25% to 5.50%. It also changed its policy stance to "calibrated tightening". This was the first increase in the repo rate since February 2023.
    bn: ৫ থেকে ৭ অক্টোবর ২০২৬ পর্যন্ত বৈঠকে ভারতীয় রিজার্ভ ব্যাংকের মুদ্রানীতি কমিটি (MPC) সর্বসম্মতিক্রমে তারল্য সমন্বয় সুবিধার (LAF) অধীনে নীতিগত রেপো রেট ২৫ বেসিস পয়েন্ট বাড়িয়ে ৫.২৫% থেকে ৫.৫০% করে। কমিটি তার নীতিগত অবস্থান বদলে "পরিমিত কঠোরতা" (calibrated tightening) করে। ফেব্রুয়ারি ২০২৩-এর পর এই প্রথম রেপো রেট বাড়ানো হলো।
  key_points:
    - { en: "Repo rate: 5.25% → 5.50% (+25 bps)", bn: "রেপো রেট: ৫.২৫% → ৫.৫০% (+২৫ বেসিস পয়েন্ট)" }
    - { en: "MPC vote on the rate: unanimous", bn: "রেট নিয়ে MPC-র ভোট: সর্বসম্মত" }
    - { en: "Stance: calibrated tightening", bn: "অবস্থান: পরিমিত কঠোরতা (calibrated tightening)" }
    - { en: "The MPC has six members and is chaired by the RBI Governor", bn: "ছয় সদস্যের MPC-র সভাপতি রিজার্ভ ব্যাংকের গভর্নর" }
  related_topics: []
  source: https://rbi.org.in/scripts/BS_PressReleaseDisplay.aspx?prid=63744
