- id: i002
  date: "2026-10-12"
  category: awards
  title:
    en: "Economics Nobel 2026: Robert E. Hall and Michael Woodford"
    bn: "অর্থনীতিতে নোবেল ২০২৬: রবার্ট ই. হল ও মাইকেল উডফোর্ড"
  body:
    en: The Royal Swedish Academy of Sciences awarded the 2026 Sveriges Riksbank Prize in Economic Sciences in Memory of Alfred Nobel jointly to Robert E. Hall (Stanford University) and Michael Woodford (Columbia University) "for microeconomic foundations of macroeconomic stabilisation". The prize was announced on 12 October 2026.
    bn: রয়্যাল সুইডিশ অ্যাকাডেমি অব সায়েন্সেস ২০২৬ সালের অর্থনীতিতে নোবেল (আলফ্রেড নোবেলের স্মৃতিতে সুইডেনের রিক্সব্যাংক পুরস্কার) যৌথভাবে রবার্ট ই. হল (স্ট্যানফোর্ড বিশ্ববিদ্যালয়) ও মাইকেল উডফোর্ড (কলম্বিয়া বিশ্ববিদ্যালয়)-কে দিয়েছে, "সামষ্টিক অর্থনৈতিক স্থিতিশীলতার ব্যষ্টিক অর্থনৈতিক ভিত্তি"-র জন্য। ১২ অক্টোবর ২০২৬ পুরস্কারটি ঘোষণা করা হয়।
  key_points:
    - { en: "Awarded by: Royal Swedish Academy of Sciences", bn: "প্রদানকারী: রয়্যাল সুইডিশ অ্যাকাডেমি অব সায়েন্সেস" }
    - { en: "Shared equally between Hall and Woodford", bn: "হল ও উডফোর্ডের মধ্যে সমানভাবে ভাগ" }
    - { en: "Woodford's work underpins interest-rate-based monetary policy used by most central banks", bn: "উডফোর্ডের কাজ সুদের হারভিত্তিক মুদ্রানীতির ভিত্তি, যা অধিকাংশ কেন্দ্রীয় ব্যাংক অনুসরণ করে" }
  related_topics: []
  source: https://www.nobelprize.org/prizes/economic-sciences/2026/press-release/
  as_of: "2026-10-12"
  status: ai-generated

- id: i003
  date: "2026-10-12"
  category: awards
  title:
    en: "Nobel Prizes 2026: physics, chemistry, medicine, literature and peace"
    bn: "নোবেল পুরস্কার ২০২৬: পদার্থবিদ্যা, রসায়ন, চিকিৎসাবিজ্ঞান, সাহিত্য ও শান্তি"
  body:
    en: The other 2026 Nobel Prizes, announced in October 2026, went to Francis Halzen (Physics, for contributions to the IceCube Neutrino Observatory and the discovery of high-energy astrophysical neutrinos), Henri B. Kagan and Kensō Soai (Chemistry, for non-linear effects and autocatalysis in asymmetric synthesis), Karl Deisseroth, Peter Hegemann and Georg Nagel (Physiology or Medicine, for light-gated ion channels and optogenetics), Anne Carson of Canada (Literature) and Navi Pillay of South Africa (Peace).
    bn: অক্টোবর ২০২৬-এ ঘোষিত অন্যান্য নোবেল পুরস্কার পেয়েছেন ফ্রান্সিস হালজেন (পদার্থবিদ্যা; আইসকিউব নিউট্রিনো মানমন্দিরে অবদান ও উচ্চশক্তির মহাজাগতিক নিউট্রিনো আবিষ্কারের জন্য), অঁরি বি. কাগান ও কেনসো সোয়াই (রসায়ন; অপ্রতিসম সংশ্লেষণে অরৈখিক প্রভাব ও স্বয়ং-অনুঘটনের জন্য), কার্ল ডাইসারথ, পিটার হেগেমান ও গেয়র্গ নাগেল (চিকিৎসাবিজ্ঞান; আলো-নিয়ন্ত্রিত আয়ন চ্যানেল ও অপটোজেনেটিক্সের জন্য), কানাডার অ্যান কারসন (সাহিত্য) এবং দক্ষিণ আফ্রিকার নাভি পিল্লাই (শান্তি)।
  key_points:
    - { en: "Physics: Francis Halzen (IceCube neutrinos)", bn: "পদার্থবিদ্যা: ফ্রান্সিস হালজেন (আইসকিউব নিউট্রিনো)" }
    - { en: "Literature: Anne Carson (Canada)", bn: "সাহিত্য: অ্যান কারসন (কানাডা)" }
    - { en: "Peace: Navi Pillay (South Africa)", bn: "শান্তি: নাভি পিল্লাই (দক্ষিণ আফ্রিকা)" }
    - { en: "The Peace Prize is awarded in Oslo; the others in Stockholm", bn: "শান্তি পুরস্কার দেওয়া হয় অসলোতে; বাকিগুলি স্টকহোমে" }
  related_topics: []
