  stem:
    en: 'For the astroid $x^{2/3} + y^{2/3} = a^{2/3}$ $(a > 0)$, the length of the part of any tangent intercepted between the coordinate axes is'
  options:
  - en: '$2a$'
  - en: '$\dfrac{a}{2}$'
  - en: '$a$'
  - en: '$a\lvert\sin 2t\rvert$ at the point $(a\cos^3t, a\sin^3t)$, so it varies'
  answer: 2
  explanation:
    en: |-
      Use $x = a\cos^3t$, $y = a\sin^3t$. The slope is $\frac{\dot y}{\dot x} = \frac{3a\sin^2t\cos t}{-3a\cos^2t\sin t} = -\tan t$, and the tangent is
      $$\frac{x}{a\cos t} + \frac{y}{a\sin t} = 1.$$
      The intercepts are $a\cos t$ and $a\sin t$, so the length is $\sqrt{a^2\cos^2t + a^2\sin^2t} = a$, the same at every point.

      $a\lvert\sin 2t\rvert$ looks like a product of the intercepts; the length is the hypotenuse, not a product.
