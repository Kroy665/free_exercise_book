  stem:
    en: 'Consider the following statements:'
  statements:
  - en: 'An algebraic curve of degree $n$ has at most $n$ asymptotes.'
  - en: 'The line $y = 0$ is an asymptote of $y = e^x$.'
  - en: 'The asymptotes of the rectangular hyperbola $xy = c^2$ $(c \ne 0)$ are the coordinate axes.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: 1 and 2 only
  - en: '1, 2 and 3'
  - en: 1 and 3 only
  - en: 2 and 3 only
  answer: 1
  explanation:
    en: |-
      1. True: the slopes are roots of $\phi_n(m) = 0$ (degree $\le n$), and together with the asymptotes parallel to the axes there are at most $n$.
      2. True: $e^x \to 0$ as $x \to -\infty$, so the distance from the curve to $y = 0$ tends to $0$. An asymptote need only be approached along one branch.
      3. True: the coefficient of the highest power of $x$ is $y$, and of $y$ is $x$, giving $y = 0$ and $x = 0$.

      So all three are correct.
