  stem:
    en: 'The normal to the parabola $y^2 = 4x$ at the point $(1, 2)$ is'
  options:
  - en: '$x - y + 1 = 0$'
  - en: '$x + y = 1$'
  - en: '$2x + y = 4$'
  - en: '$x + y = 3$'
  answer: 3
  explanation:
    en: |-
      Differentiate: $2yy' = 4$, so $y' = \frac{2}{y} = 1$ at $(1, 2)$. The normal has slope $-1$:
      $$y - 2 = -(x - 1) \implies x + y = 3.$$
      $x - y + 1 = 0$ is the **tangent** at $(1, 2)$, not the normal.
