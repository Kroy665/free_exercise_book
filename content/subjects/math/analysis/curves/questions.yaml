    en: 'Consider the following statements about double points at the origin:'
  statements:
  - en: 'The folium $x^3 + y^3 = 3axy$ $(a > 0)$ has a node at the origin, with tangents $x = 0$ and $y = 0$.'
  - en: 'The cissoid $y^2(2a - x) = x^3$ $(a > 0)$ has a cusp at the origin.'
