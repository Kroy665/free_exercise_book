  stem:
    en: 'With the focus as pole, the pedal equation of the parabola $y^2 = 4ax$ is'
  options:
  - en: '$p^2 = 2ar$'
  - en: '$p = ar^2$'
  - en: '$p^2 = ar$'
  - en: '$p^2 = \dfrac{r^3}{2a}$'
  answer: 2
  explanation:
    en: |-
      With the focus as pole and a suitable initial line, the parabola is $\frac{2a}{r} = 1 - \cos\theta$. Put $u = \frac1r = \frac{1 - \cos\theta}{2a}$, $u_\theta = \frac{\sin\theta}{2a}$:
      $$\frac{1}{p^2} = u^2 + u_\theta^2 = \frac{(1 - \cos\theta)^2 + \sin^2\theta}{4a^2} = \frac{2(1 - \cos\theta)}{4a^2} = \frac{1}{ar}.$$
      So $p^2 = ar$.

      Check at the vertex: $r = a$ and the tangent there is at distance $a$ from the focus, so $p^2 = a^2 = a\cdot a$. $p^2 = \frac{r^3}{2a}$ is the cardioid's pedal equation.
  status: ai-generated
