  stem:
    en: 'The tangent to $y = x^3$ at the point $(1, 1)$ is'
  options:
  - en: '$y = 3x + 2$'
  - en: '$3y = x + 2$'
  - en: '$y = x$'
  - en: '$y = 3x - 2$'
  answer: 3
  explanation:
    en: |-
      The slope is $\frac{dy}{dx} = 3x^2 = 3$ at $x = 1$. So
      $$y - 1 = 3(x - 1) \implies y = 3x - 2.$$
      Check: $(1, 1)$ satisfies $1 = 3 - 2$. The option $3y = x + 2$ is the line through $(1,1)$ with slope $\frac13$, the reciprocal slope.
  status: ai-generated
- id: q0002
