  stem:
    en: 'For a real function $f(x,y)$ and a point $(a,b)$, consider the following statements:'
  statements:
  - en: 'If $f$ is differentiable at $(a,b)$, then $f$ is continuous at $(a,b)$.'
  - en: 'If $f_x(a,b)$ and $f_y(a,b)$ both exist, then $f$ is continuous at $(a,b)$.'
  - en: 'If $f_x$ and $f_y$ exist in a neighbourhood of $(a,b)$ and are continuous at $(a,b)$, then $f$ is differentiable at $(a,b)$.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: '1, 2 and 3'
  - en: 1 and 2 only
  - en: 1 and 3 only
  - en: 3 only
  answer: 2
  explanation:
    en: |-
      1 is true: in $f(a+h,b+k) - f(a,b) = Ah + Bk + \varepsilon\sqrt{h^2+k^2}$, the right side tends to $0$.

      2 is false: $\frac{xy}{x^2+y^2}$ (with $f(0,0) = 0$) has $f_x(0,0) = f_y(0,0) = 0$ but no limit at the origin.

      3 is true: it is the standard sufficient condition for differentiability (proved with the mean value theorem in each variable).
