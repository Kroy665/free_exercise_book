- id: q0006
  type: single
  difficulty: 3
  exams: *id001
  refs:
  - differentiability
  stem:
    en: 'For $f(x,y) = \sqrt{\lvert xy\rvert}$ at the origin, which statement is correct?'
  options:
  - en: '$f$ is differentiable at $(0,0)$'
  - en: '$f$ is continuous, but $f_x(0,0)$ does not exist'
  - en: '$f$ is not continuous at $(0,0)$'
  - en: '$f$ is continuous and $f_x(0,0) = f_y(0,0) = 0$, but $f$ is not differentiable'
  answer: 3
  explanation:
    en: |-
      Continuity: $\sqrt{|xy|} \le \frac{|x| + |y|}{2} \to 0$.

      Partials: $f(h,0) = f(0,k) = 0$, so both partial derivatives are $0$.

      Differentiability would need
      $$\frac{f(h,k) - 0 - 0\cdot h - 0\cdot k}{\sqrt{h^2+k^2}} = \frac{\sqrt{|hk|}}{\sqrt{h^2+k^2}} \to 0.$$
      Along $h = k$ this ratio is $\frac{|h|}{\sqrt2|h|} = \frac{1}{\sqrt2}$. So $f$ is not differentiable.

      "Differentiable" is the tempting option: continuity and existing partials are not enough.
  status: ai-generated
