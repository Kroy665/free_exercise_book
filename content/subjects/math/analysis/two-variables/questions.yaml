    en: 'Consider the following statements about the mixed partial derivatives of $f(x,y)$ at a point $(a,b)$:'
  statements:
  - en: 'If $f_x$, $f_y$ and $\dfrac{\partial}{\partial y}\left(\dfrac{\partial f}{\partial x}\right)$ exist in a neighbourhood of $(a,b)$ and the last is continuous at $(a,b)$, then $\dfrac{\partial}{\partial x}\left(\dfrac{\partial f}{\partial y}\right)(a,b)$ exists and the two mixed derivatives are equal at $(a,b)$.'
  - en: 'If $f_x$ and $f_y$ are both differentiable at $(a,b)$, then the two mixed derivatives at $(a,b)$ are equal.'
  - en: 'If both mixed derivatives exist at $(a,b)$, then they are equal.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: '1, 2 and 3'
  - en: 1 only
  - en: 2 and 3 only
  - en: 1 and 2 only
  answer: 3
  explanation:
    en: |-
      1 is Schwarz's theorem and 2 is Young's theorem; both are true.

      3 is false. For $f = \frac{xy(x^2-y^2)}{x^2+y^2}$, $f(0,0) = 0$, we have $f_x(0,y) = -y$ and $f_y(x,0) = x$, so at the origin
      $$\frac{\partial}{\partial y}\frac{\partial f}{\partial x} = -1, \qquad \frac{\partial}{\partial x}\frac{\partial f}{\partial y} = 1.$$
      Both exist and differ.
