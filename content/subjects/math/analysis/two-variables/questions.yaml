    en: 'Let $f(x,y) = \dfrac{xy(x^2 - y^2)}{x^2 + y^2}$ for $(x,y) \ne (0,0)$ and $f(0,0) = 0$. The value of $\dfrac{\partial}{\partial y}\left(\dfrac{\partial f}{\partial x}\right)$ at $(0,0)$ is'
