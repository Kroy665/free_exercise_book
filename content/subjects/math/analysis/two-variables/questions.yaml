  stem:
    en: 'Let $f(x,y) = \dfrac{xy}{x^2 + y^2}$ for $(x,y) \ne (0,0)$ and $f(0,0) = 0$. At the origin,'
  options:
  - en: '$f$ is continuous, but $f_x(0,0)$ does not exist'
  - en: '$f$ is differentiable'
  - en: '$f_x(0,0) = f_y(0,0) = \dfrac12$'
  - en: '$f_x(0,0)$ and $f_y(0,0)$ both exist, but $f$ is not continuous'
  answer: 3
  explanation:
    en: |-
      On the axes $f = 0$, so
      $$f_x(0,0) = \lim_{h\to0}\frac{f(h,0) - 0}{h} = 0, \qquad f_y(0,0) = 0.$$
      Along $y = mx$, $f = \frac{m}{1+m^2}$, which depends on $m$, so $f$ has no limit at the origin and is not continuous. Hence it is not differentiable either.

      $\frac12$ is the value along $y = x$, not a partial derivative.
