      By limit comparison with $\sum n^{-3/2}$ ($p = \frac32 > 1$) it converges.

      - $\sum\left(\sqrt{n + 1} - \sqrt n\right)$ telescopes to $\sqrt{n + 1} - 1 \to \infty$.
