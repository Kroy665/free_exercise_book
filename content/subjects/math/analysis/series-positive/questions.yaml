  stem:
    en: 'Cauchy''s criterion states that a series $\sum a_n$ converges if and only if, for every $\varepsilon > 0$, there is an $N$ such that'
  options:
  - en: '$\lvert a_n\rvert < \varepsilon$ for all $n \ge N$'
  - en: '$\lvert a_{n+1} + \cdots + a_{2n}\rvert < \varepsilon$ for all $n \ge N$'
  - en: '$\lvert a_{n+1} - a_n\rvert < \varepsilon$ for all $n \ge N$'
  - en: '$\lvert a_{n+1} + a_{n+2} + \cdots + a_m\rvert < \varepsilon$ for all $m > n \ge N$'
  answer: 3
  explanation:
    en: |-
      The criterion is Cauchy's principle for the partial sums: $\lvert s_m - s_n\rvert = \lvert a_{n+1} + \cdots + a_m\rvert < \varepsilon$ for **all** $m > n \ge N$.

      The others are necessary but not sufficient:
      - $a_n \to 0$ holds for $\sum\frac1n$, which diverges.
      - $s_{2n} - s_n \to 0$ holds for $\sum\frac{1}{n\ln n}$, which diverges.
      - $a_{n+1} - a_n \to 0$ holds even for $a_n = 1$.
