  left:
  - en: '$\displaystyle\bigcap_{n} \left[0, \tfrac1n\right]$'
  - en: '$\displaystyle\bigcap_{n} \left(0, \tfrac1n\right)$'
  - en: '$\displaystyle\bigcap_{n} \left[-\tfrac1n, 1 + \tfrac1n\right]$'
  - en: '$\displaystyle\bigcup_{n} \left[\tfrac1n, 1\right]$'
  right:
  - en: '$\varnothing$'
  - en: '$(0, 1]$'
  - en: '$\{0\}$'
  - en: '$[0, 1]$'
