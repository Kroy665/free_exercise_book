  - en: 'A-1, B-3, C-4, D-2'
  - en: 'A-3, B-1, C-4, D-2'
  - en: 'A-3, B-1, C-2, D-4'
  answer: 2
  explanation:
    en: |-
      - A: $0$ lies in every $[0, \frac1n]$; any $x > 0$ is excluded once $\frac1n < x$ (Archimedes). So $\{0\}$.
      - B: $0$ is never in $(0, \frac1n)$, and any $x > 0$ is excluded as in A. So $\varnothing$; the nested interval theorem needs **closed** intervals.
