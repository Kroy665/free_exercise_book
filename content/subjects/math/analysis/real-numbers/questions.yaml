    en: 'Let $S \subseteq \R$ be nonempty and let $u$ be an upper bound of $S$. Then $u = \sup S$ if and only if'
  options:
  - en: 'for some $\varepsilon > 0$ there is $x \in S$ with $x > u - \varepsilon$'
  - en: 'for every $\varepsilon > 0$ there is $x \in S$ with $x > u + \varepsilon$'
