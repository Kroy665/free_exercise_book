  - en: '$\dfrac{4}{9}$'
  - en: '$\dfrac{36}{100}$'
  answer: 1
  explanation:
    en: |-
      Let $x = 0.\overline{36}$. Then $100x = 36.\overline{36}$, so $99x = 36$ and
      $$x = \frac{36}{99} = \frac{4}{11}.$$

      $\frac{9}{25} = \frac{36}{100} = 0.36$ is the terminating decimal, which ignores the recurrence. Check: $\frac{4}{11} = 0.3636\ldots$
  status: ai-generated
