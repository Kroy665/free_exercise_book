  - slst-0910
  - slst-1112
  refs:
  - sup-inf
  - archimedean
  stem:
    en: 'For $S = \left\{\dfrac1n : n \in \N\right\}$, the infimum of $S$ is'
  options:
  - en: '$0$, and it is not attained in $S$'
  - en: '$0$, and it is the minimum of $S$'
  - en: '$1$'
  - en: It does not exist
  answer: 0
  explanation:
    en: |-
      Every $\frac1n > 0$, so $0$ is a lower bound. No $\varepsilon > 0$ is a lower bound: by the Archimedean property there is an $n$ with $\frac1n < \varepsilon$. Hence
      $$\inf S = 0,$$
      but $\frac1n \ne 0$ for every $n$, so $0 \notin S$ and $S$ has no minimum.

      $1$ is the supremum (and maximum), not the infimum. The set is bounded below, so the infimum exists by completeness.
  status: ai-generated
- id: q0002
  type: single
  difficulty: 1
  exams: *id001
  refs:
  - rationals-irrationals
  stem:
    en: Which of the following numbers is irrational?
  options:
  - en: '$\log_2 8$'
  - en: '$\sqrt{2.25}$'
  - en: '$0.\overline{12}$'
  - en: '$\log_2 3$'
  answer: 3
  explanation:
    en: |-
      If $\log_2 3 = \frac pq$ with $p, q \in \N$, then $2^p = 3^q$: an even number equals an odd number, which is impossible. So $\log_2 3$ is irrational.

      The others are rational: $\log_2 8 = 3$; $\sqrt{2.25} = \sqrt{\frac94} = \frac32$; and $0.\overline{12} = \frac{12}{99} = \frac{4}{33}$, since a recurring decimal is rational.
  status: ai-generated
- id: q0003
  type: single
  difficulty: 3
  exams: *id001
  refs:
  - sup-inf
  stem:
    en: 'For $S = \left\{(-1)^n + \dfrac1n : n \in \N\right\}$,'
  options:
  - en: '$\sup S = 2$ and $\inf S = -1$'
  - en: '$\sup S = \dfrac32$ and $\inf S = 0$'
  - en: '$\sup S = \dfrac32$ and $\inf S = -1$'
  - en: '$\sup S = 1$ and $\inf S = -1$'
  answer: 2
  explanation:
    en: |-
      Split by parity.

      - Even $n = 2k$: $1 + \frac{1}{2k}$ gives $\frac32, \frac54, \frac76, \dots$, which decrease towards $1$. The largest is $\frac32$, at $n = 2$.
      - Odd $n = 2k - 1$: $-1 + \frac{1}{2k-1}$ gives $0, -\frac23, -\frac45, \dots$, which decrease towards $-1$ and never reach it.

      So $$\sup S = \max S = \frac32, \qquad \inf S = -1\ (\text{not attained}).$$

      $2$ would be the value at $n = 1$ if $(-1)^1$ were $+1$; in fact the $n = 1$ term is $-1 + 1 = 0$. $\sup = 1$ confuses the supremum with the limit of the even terms.
  status: ai-generated
