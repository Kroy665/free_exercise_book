- id: q0008
  type: single
  difficulty: 2
  exams: *id001
  refs:
  - sup-inf
  - ordered-field
  stem:
    en: 'Let $A = \{x \in \Q : x > 0,\ x^2 < 2\}$. Which statement is correct?'
  options:
  - en: '$A$ is not bounded above in $\Q$'
  - en: '$A$ is bounded above in $\Q$ but has no supremum in $\Q$; in $\R$, $\sup A = \sqrt2$'
  - en: '$\sup A = 2$ in $\Q$'
  - en: '$A$ has a maximum element in $\Q$'
  answer: 1
  explanation:
    en: |-
      $2$ (or $1.5$) is a rational upper bound, so $A$ is bounded above in $\Q$. In $\R$, completeness gives $\sup A$, and it equals $\sqrt2$: every rational $x$ with $x^2 < 2$ is below $\sqrt2$, and by density there are rationals in $A$ arbitrarily close to $\sqrt2$.

      Since $\sqrt2 \notin \Q$, there is no least rational upper bound: any rational $r > \sqrt2$ has a smaller rational between $\sqrt2$ and $r$. This is why $\Q$ is not complete.

      $2$ is an upper bound but not the least. There is no maximum: for $x \in A$ there is a rational between $x$ and $\sqrt2$.
  status: ai-generated
- id: q0009
  type: single
  difficulty: 2
  exams: *id001
  refs:
  - archimedean
  stem:
    en: 'The Archimedean property of $\R$ states that'
  options:
  - en: 'for every $x, y \in \R$, there is $n \in \N$ with $nx > y$'
  - en: 'for every $x > 0$ and every $y \in \R$, there is $n \in \N$ with $nx < y$'
  - en: 'there is $x > 0$ such that $nx > y$ for every $n \in \N$ and every $y \in \R$'
  - en: 'for every $x > 0$ and every $y \in \R$, there is $n \in \N$ with $nx > y$'
  answer: 3
  explanation:
    en: |-
      Archimedean property: given any positive $x$ (however small) and any $y$ (however large), some multiple $nx$ exceeds $y$. Equivalently, $\N$ is not bounded above.

      The condition $x > 0$ is essential: with $x = -1$, $y = 0$, no $n$ gives $-n > 0$. The version with $nx < y$ fails for $y = -1$. The last option would make a single $x$ exceed every real $y$, which is absurd (take $n = 1$, $y = x$).
  status: ai-generated
- id: q0010
  type: single
  difficulty: 1
  exams: *id001
  refs:
  - archimedean
  stem:
    en: Between any two distinct real numbers there are
  options:
  - en: infinitely many rationals and infinitely many irrationals
  - en: infinitely many rationals but possibly no irrational
  - en: at least one irrational but possibly no rational
  - en: only finitely many rationals
  answer: 0
  explanation:
    en: |-
      Density of $\Q$: if $a < b$, there is a rational $r \in (a, b)$; repeating in $(a, r)$, $(r, b)$, ... gives infinitely many.

      Density of the irrationals: pick a rational $r$ with $a - \sqrt2 < r < b - \sqrt2$; then $r + \sqrt2 \in (a, b)$ is irrational. Again there are infinitely many.

      So both kinds occur infinitely often in every interval.
  status: ai-generated
- id: q0011
  type: single
  difficulty: 2
  exams: *id001
  refs:
  - rationals-irrationals
  stem:
    en: 'Let $a$ be a nonzero rational and $b$ an irrational number. Which of $a + b$ and $ab$ are necessarily irrational?'
  options:
  - en: '$a + b$ only'
  - en: '$ab$ only'
  - en: Neither
  - en: 'Both $a + b$ and $ab$'
  answer: 3
  explanation:
    en: |-
      - If $a + b = s \in \Q$, then $b = s - a \in \Q$, a contradiction. So $a + b$ is irrational.
      - If $ab = s \in \Q$, then $b = \frac sa \in \Q$ (dividing is allowed because $a \ne 0$), a contradiction. So $ab$ is irrational.

      Example: $a = 2$, $b = \sqrt2$ gives $2 + \sqrt2$ and $2\sqrt2$, both irrational. The condition $a \ne 0$ is what saves the product; with $a = 0$, $ab = 0$.
  status: ai-generated
