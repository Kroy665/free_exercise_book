  stem:
    en: 'Let $x_n = \dfrac{2}{(4n + 1)\pi}$. What is $\displaystyle\lim_{n\to\infty}\sin\frac{1}{x_n}$, and what does Heine''s definition then give for $\displaystyle\lim_{x\to 0}\sin\frac1x$?'
  options:
  - en: '$0$; equals $0$'
  - en: '$1$; does not exist, since $y_n = \frac{1}{n\pi}$ gives the limit $0$'
  - en: '$1$; equals $1$'
  - en: '$-1$; does not exist, since $y_n = \frac{1}{n\pi}$ gives the limit $0$'
  answer: 1
  explanation:
    en: |-
      $\frac{1}{x_n} = 2n\pi + \frac{\pi}{2}$, so $\sin\frac{1}{x_n} = 1$ for every $n$, and the limit is $1$.

      With $y_n = \frac{1}{n\pi} \to 0$, $\sin\frac{1}{y_n} = \sin n\pi = 0$. Two sequences tending to $0$ give different limits of $f$, so by Heine's definition $\lim_{x\to 0}\sin\frac1x$ does not exist.
      "Equals $1$" is wrong: a single sequence cannot prove a limit exists; Heine needs **every** sequence.
