- id: q0020
  type: single
  difficulty: 3
  exams: *id001
  refs:
  - limit-definition
  stem:
    en: 'For the $\varepsilon$–$\delta$ proof of $\displaystyle\lim_{x\to 3}x^2 = 9$, which choice of $\delta$ works for **every** $\varepsilon > 0$?'
  options:
  - en: '$\delta = \varepsilon/7$'
  - en: '$\delta = \min\{1, \varepsilon/7\}$'
  - en: '$\delta = \min\{1, \varepsilon/6\}$'
  - en: '$\delta = \varepsilon/6$'
  answer: 1
  explanation:
    en: |-
      If $|x - 3| < \delta$, then $|x^2 - 9| = |x - 3|\,|x + 3| < \delta(6 + \delta)$, and this bound is approached.

      - $\delta = \min\{1, \varepsilon/7\}$: $\delta(6 + \delta) \le 7\delta \le \varepsilon$. Works.
      - $\delta = \varepsilon/7$: for $\varepsilon = 70$, $\delta = 10$ and $\delta(6 + \delta) = 160 > 70$. Fails.
      - $\delta = \min\{1, \varepsilon/6\}$: for $\varepsilon = 1$, $\delta(6 + \delta) = 1 + \frac1{36} > 1$. Fails.
      - $\delta = \varepsilon/6$ fails for the same reason.

      The restriction $\delta \le 1$ bounds $|x + 3|$ by $7$, not $6$.
  status: ai-generated
