  stem:
    en: 'Let $f(x) = [x] + [-x]$, where $[\,\cdot\,]$ is the greatest integer function. At each integer $n$, $f$ has'
  options:
  - en: a jump discontinuity
  - en: a removable discontinuity
  - en: a discontinuity of the second kind
  - en: no discontinuity
  answer: 1
  explanation:
    en: |-
      If $x = n$ is an integer, $f(n) = n - n = 0$. If $x$ is not an integer, $[-x] = -[x] - 1$, so $f(x) = -1$.

      So $f(n-) = f(n+) = -1 \ne f(n) = 0$: the limit exists but differs from the value, a **removable** discontinuity.
      "Jump" is the trap: each of $[x]$ and $[-x]$ jumps at $n$, but the jumps cancel.
  status: ai-generated
