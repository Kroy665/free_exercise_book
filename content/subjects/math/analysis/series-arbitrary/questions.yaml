  stem:
    en: 'For a series $\sum a_n$ of real terms, which of the following is always true?'
  options:
  - en: 'If $\sum \lvert a_n\rvert$ converges, then $\sum a_n$ converges.'
  - en: 'If $\sum a_n$ converges, then $\sum \lvert a_n\rvert$ converges.'
  - en: 'If $a_n \to 0$, then $\sum a_n$ converges.'
  - en: 'If $\sum a_n$ converges, then $\sum a_n^2$ converges.'
  answer: 0
  explanation:
    en: |-
      Absolute convergence implies convergence, by Cauchy's criterion:
      $$|a_{n+1} + \cdots + a_m| \le |a_{n+1}| + \cdots + |a_m|.$$

      The others fail:
      - $\sum\frac{(-1)^n}{n}$ converges, but $\sum\frac1n$ does not.
      - $a_n = \frac1n \to 0$, but $\sum\frac1n$ diverges.
      - $a_n = \frac{(-1)^n}{\sqrt n}$: $\sum a_n$ converges (Leibniz) but $\sum a_n^2 = \sum\frac1n$ diverges.
  status: ai-generated
