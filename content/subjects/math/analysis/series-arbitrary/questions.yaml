  stem:
    en: 'The rearrangement $1 + \dfrac13 - \dfrac12 + \dfrac15 + \dfrac17 - \dfrac14 + \cdots$ of $1 - \dfrac12 + \dfrac13 - \cdots$ (two positive terms, then one negative term, in turn) has sum'
