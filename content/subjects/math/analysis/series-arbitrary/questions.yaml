  stem:
    en: 'For a fixed $x$ with $0 < x < \pi$, the series $\displaystyle\sum_{n=1}^{\infty}\frac{\sin nx}{n}$ is'
  options:
  - en: Absolutely convergent
  - en: Divergent
  - en: 'Convergent only for $x = \dfrac{\pi}{2}$'
  - en: Conditionally convergent
  answer: 3
  explanation:
    en: |-
      **Converges:** for $x \notin 2\pi\Z$, $\left|\sum_{k=1}^n \sin kx\right| \le \frac{1}{\sin(x/2)}$ (bounded), and $\frac1n$ decreases to $0$. Dirichlet's test applies. (The sum is $\frac{\pi - x}{2}$.)

      **Not absolutely:** $|\sin nx| \ge \sin^2 nx = \frac{1 - \cos 2nx}{2}$. Here $\sum\frac{1}{2n}$ diverges while $\sum\frac{\cos 2nx}{2n}$ converges (Dirichlet, as $2x \notin 2\pi\Z$), so $\sum\frac{|\sin nx|}{n}$ diverges.

      Hence conditionally convergent, for every $x$ in $(0, \pi)$.
  status: ai-generated
