  stem:
    en: 'The series $\displaystyle\sum_{n=1}^{\infty}\frac{(-1)^n}{n^p}$ is conditionally convergent if and only if'
  options:
  - en: '$0 < p \le 1$'
  - en: '$p > 1$'
  - en: '$0 < p < 1$'
  - en: '$p \ge 1$'
  answer: 0
  explanation:
    en: |-
      - $p > 1$: $\sum\frac{1}{n^p}$ converges, so the series is **absolutely** convergent.
      - $0 < p \le 1$: $\sum\frac1{n^p}$ diverges, but $\frac1{n^p}$ decreases to $0$, so Leibniz gives convergence: **conditional**.
      - $p \le 0$: the terms do not tend to $0$: divergent.

      The trap is $p = 1$: the alternating harmonic series is conditionally convergent, so $0 < p < 1$ misses it.
  status: ai-generated
