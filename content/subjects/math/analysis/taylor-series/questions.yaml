    en: 'Using the Lagrange remainder with $e^{\theta} < 3$, the smallest $n$ for which $\sum_{k=0}^{n}\frac{1}{k!}$ is guaranteed to approximate $e$ with error less than $10^{-3}$ is'
  options:
