  stem:
    en: 'The largest set of real $x$ on which the Maclaurin series of $\log(1 + x)$ converges to $\log(1 + x)$ is'
  options:
  - en: '$-1 \le x \le 1$'
  - en: '$-1 < x < 1$'
  - en: '$-1 \le x < 1$'
  - en: '$-1 < x \le 1$'
  answer: 3
  explanation:
    en: |-
      For $\lvert x\rvert < 1$ the remainder tends to $0$ (Lagrange form on $[0, 1)$, Cauchy form on $(-1, 0)$). At $x = 1$ the Lagrange remainder satisfies $\lvert R_{n+1}\rvert \le \frac{1}{n + 1} \to 0$, giving
      $$\log 2 = 1 - \tfrac12 + \tfrac13 - \cdots.$$
      At $x = -1$ the series is $-(1 + \frac12 + \frac13 + \cdots)$, which diverges, and $\log 0$ is undefined. So the set is $(-1, 1]$.
      $[-1, 1)$ is the range for $-\log(1 - x)$, the mirror series.
  status: ai-generated
