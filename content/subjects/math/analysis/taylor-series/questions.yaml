  stem:
    en: 'Let $f^{(n)}$ be continuous on $[a, a + h]$ and $f^{(n+1)}$ exist on $(a, a + h)$. In $f(a + h) = \sum_{k=0}^{n}\frac{h^k}{k!}f^{(k)}(a) + R_{n+1}$, the Lagrange form of $R_{n+1}$ is ($0 < \theta < 1$)'
  options:
  - en: '$\dfrac{h^{n+1}}{n!}f^{(n+1)}(a + \theta h)$'
  - en: '$\dfrac{h^{n+1}}{(n+1)!}f^{(n+1)}(a + \theta h)$'
  - en: '$\dfrac{h^{n+1}(1 - \theta)^n}{(n+1)!}f^{(n+1)}(a + \theta h)$'
  - en: '$\dfrac{h^{n+1}}{(n+1)!}f^{(n+1)}(\theta h)$'
  answer: 1
  explanation:
    en: |-
      The Lagrange remainder looks like the next term of the series, evaluated at an intermediate point:
      $$R_{n+1} = \frac{h^{n+1}}{(n+1)!}f^{(n+1)}(a + \theta h).$$
      The factor $(1 - \theta)^n$ belongs to the Cauchy form, which has $n!$ (not $(n+1)!$) in the denominator. Writing $f^{(n+1)}(\theta h)$ forgets that the intermediate point lies between $a$ and $a + h$.
      Check with $n = 0$: you must get Lagrange's MVT, $f(a + h) = f(a) + hf'(a + \theta h)$.
  status: ai-generated
