  stem:
    en: 'Let $f(x) = e^{-1/x^2}$ for $x \ne 0$ and $f(0) = 0$. The Maclaurin series of $f$ is'
  options:
  - en: '$1 - x^2 + \dfrac{x^4}{2!} - \cdots$'
  - en: 'identically $0$, since $f^{(n)}(0) = 0$ for every $n$'
  - en: 'not defined, since $f''(0)$ does not exist'
  - en: '$\displaystyle\sum_{n=0}^{\infty}\frac{(-1)^n}{n!\,x^{2n}}$'
  answer: 1
  explanation:
    en: |-
      Each derivative for $x \ne 0$ is $P_n(1/x)e^{-1/x^2}$, and $t^k e^{-t^2} \to 0$ as $\lvert t\rvert \to \infty$. So every difference quotient at $0$ tends to $0$, and $f^{(n)}(0) = 0$ for all $n$. The Maclaurin series is $0 + 0x + 0x^2 + \cdots$.
      $1 - x^2 + \frac{x^4}{2!} - \cdots$ is the series of $e^{-x^2}$, a different function. The last option is the series of $e^{-1/x^2}$ in powers of $1/x$, not a Maclaurin series.
  status: ai-generated
