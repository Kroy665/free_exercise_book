      $f'(0) = f''(0) = f'''(0) = 0$ and $f^{(4)}(0) = 24 > 0$. The first non-vanishing derivative has **even** order $4$ and is positive, so $0$ is a local minimum (indeed $x^4 \ge 0 = f(0)$).

