  stem:
    en: 'Let $f, g$ be differentiable on a deleted neighbourhood of $a$. Consider the following statements:'
  statements:
  - en: 'If $g''(x) \ne 0$ near $a$, $f(x) \to 0$, $g(x) \to 0$ and $\dfrac{f''(x)}{g''(x)} \to L$ as $x \to a$, then $\dfrac{f(x)}{g(x)} \to L$.'
  - en: 'If $\displaystyle\lim_{x\to a}\frac{f(x)}{g(x)}$ exists, then $\displaystyle\lim_{x\to a}\frac{f''(x)}{g''(x)}$ exists.'
  - en: '$\displaystyle\lim_{x\to0}\frac{x^2\sin(1/x)}{\sin x}$ exists, although the corresponding $\displaystyle\lim_{x\to0}\frac{f''(x)}{g''(x)}$ does not.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: 1 only
  - en: 1 and 3 only
  - en: 1 and 2 only
  - en: '1, 2 and 3'
  answer: 1
  explanation:
    en: |-
      1. True: this is L'Hospital's rule for $0/0$, with its exact hypotheses.
      2. False: the rule is one-way. Statement 3 is a counterexample.
      3. True: $\dfrac{x^2\sin(1/x)}{\sin x} = \dfrac{x}{\sin x}\cdot x\sin\frac1x \to 1\cdot 0 = 0$. But
      $$\frac{f'(x)}{g'(x)} = \frac{2x\sin(1/x) - \cos(1/x)}{\cos x},$$
      and $\cos(1/x)$ oscillates between $-1$ and $1$, so this has no limit.

      So 1 and 3 only.
  status: ai-generated
- id: q0023
