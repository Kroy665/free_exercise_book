  - en: '$1$'
  - en: '$3$'
  - en: '$5$'
  - en: '$21$'
  answer: 2
  explanation:
    en: |-
      $f'(x) = 3x^2 - 12x + 9 = 3(x - 1)(x - 3)$. The sign of $f'$ is $+, -, +$ across $1$ and $3$, so $x = 1$ gives a local maximum:
      $$f(1) = 1 - 6 + 9 + 1 = 5.$$

      $1 = f(3)$ is the local **minimum**; $3 = f(2)$ is the value at the point of inflexion.
