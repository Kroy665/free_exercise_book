- id: q0013
  type: single
  difficulty: 2
  exams: *id001
  refs:
  - global-extrema
  stem:
    en: 'The height of the right circular cylinder of greatest volume that can be inscribed in a sphere of radius $R$ is'
  options:
  - en: '$\dfrac{4R}{3}$'
  - en: '$\dfrac{2R}{\sqrt3}$'
  - en: '$R\sqrt2$'
  - en: '$R$'
  answer: 1
  explanation:
    en: |-
      With height $h$, the radius satisfies $r^2 = R^2 - \frac{h^2}{4}$, so
      $$V = \pi r^2 h = \pi\left(R^2 h - \frac{h^3}{4}\right), \qquad V' = \pi\left(R^2 - \frac{3h^2}{4}\right) = 0 \implies h = \frac{2R}{\sqrt3}.$$
      $V'' = -\frac{3\pi h}{2} < 0$, so this is the maximum, with $V = \dfrac{4\pi R^3}{3\sqrt3}$.

      $\frac{4R}{3}$ is the height of the inscribed **cone** of greatest volume.
  status: ai-generated
- id: q0014
  type: single
  difficulty: 1
  exams: *id001
  refs:
  - global-extrema
  stem:
    en: 'A closed right circular cylinder has a given volume. Its total surface area is least when the height $h$ and radius $r$ satisfy'
  options:
  - en: '$h = r$'
  - en: '$h = \dfrac r2$'
  - en: '$h = 2r$'
  - en: '$h = 4r$'
  answer: 2
  explanation:
    en: |-
      With $V = \pi r^2 h$ fixed, $h = \frac{V}{\pi r^2}$ and
      $$S = 2\pi r^2 + 2\pi r h = 2\pi r^2 + \frac{2V}{r}, \qquad S' = 4\pi r - \frac{2V}{r^2} = 0 \implies V = 2\pi r^3.$$
      Then $h = \frac{V}{\pi r^2} = 2r$: the height equals the diameter. $S'' > 0$, so it is a minimum.

      $h = r$ is the answer for an **open-top** cylinder.
  status: ai-generated
