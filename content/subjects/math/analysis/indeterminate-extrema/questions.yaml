    en: 'For a real constant $a$, $\displaystyle\lim_{x\to\infty}\left(1 + \frac ax\right)^x$ equals'
  options:
  - en: '$1$'
  - en: '$ae$'
  - en: '$e^{1/a}$'
  - en: '$e^a$'
  answer: 3
  explanation:
    en: |-
      The form is $1^\infty$. Using $\lim f^g = e^{\lim g(f - 1)}$:
      $$\lim_{x\to\infty} x\cdot\frac ax = a, \quad\text{so the limit is } e^a.$$
      (Or: $\ln y = x\ln(1 + a/x) = \dfrac{\ln(1 + a/x)}{1/x} \to a$ by L'Hospital.)

      $1$ is the classic mistake "$1^\infty = 1$".
