  stem:
    en: 'Consider the following statements about a real function $f$ and an interior point $c$ of its domain:'
  statements:
  - en: 'If $f''(c) = 0$ and $f''''(c) = 0$, then $f$ has no local extremum at $c$.'
  - en: 'If $f''(c) = \cdots = f^{(n-1)}(c) = 0$ and $f^{(n)}(c) > 0$ with $n$ even, then $f$ has a local minimum at $c$.'
  - en: '$f$ can have a local extremum at a point where it is not differentiable.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: 1 and 2 only
  - en: 2 only
  - en: '1, 2 and 3'
  - en: 2 and 3 only
  answer: 3
  explanation:
    en: |-
      1. False: $f(x) = x^4$ has $f'(0) = f''(0) = 0$ and a minimum at $0$. When $f''(c) = 0$ the second-derivative test is silent.
      2. True: this is the higher-derivative test. By Taylor, $f(c + h) - f(c) \approx \dfrac{h^n}{n!}f^{(n)}(c) > 0$ for small $h \ne 0$ when $n$ is even.
      3. True: $f(x) = \lvert x\rvert$ has a minimum at $0$, where $f'(0)$ does not exist.

      So 2 and 3 only.
