    en: |-
      Let $y = x^{1/x}$, so $\ln y = \dfrac{\ln x}{x}$ and
      $$\frac{d}{dx}\frac{\ln x}{x} = \frac{1 - \ln x}{x^2},$$
      which is $> 0$ for $x < e$ and $< 0$ for $x > e$. So the maximum is at $x = e$, with value $e^{1/e} \approx 1.445$.

