  stem:
    en: '$\displaystyle\lim_{x\to0^+} x^x$ equals'
  options:
  - en: '$0$'
  - en: '$1$'
  - en: '$e$'
  - en: '$\dfrac1e$'
  answer: 1
  explanation:
    en: |-
      The form is $0^0$. Put $y = x^x$, so $\ln y = x\ln x = \dfrac{\ln x}{1/x}$ ($\infty/\infty$):
      $$\lim_{x\to0^+}\frac{\ln x}{1/x} = \lim\frac{1/x}{-1/x^2} = \lim(-x) = 0.$$
      So $y \to e^0 = 1$.

      $0$ treats the base alone; $\frac1e$ is the **least value** of $x^x$ (at $x = \frac1e$), not the limit at $0$.
  status: ai-generated
