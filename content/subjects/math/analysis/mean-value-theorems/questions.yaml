  refs:
  - derivative
  stem:
    en: 'At $x = 0$, the function $f(x) = \lvert x\rvert$ is'
  options:
  - en: differentiable but not continuous
  - en: both continuous and differentiable
  - en: continuous but not differentiable
  - en: neither continuous nor differentiable
  answer: 2
  explanation:
    en: |-
      $f(h) \to 0 = f(0)$, so $f$ is continuous at $0$. The one-sided derivatives are
      $$Rf'(0) = \lim_{h\to0^+}\frac{|h|}{h} = 1, \qquad Lf'(0) = \lim_{h\to0^-}\frac{|h|}{h} = -1,$$
      and they differ, so $f'(0)$ does not exist (a corner).

      "Differentiable but not continuous" is impossible: differentiability always implies continuity.
  status: ai-generated
