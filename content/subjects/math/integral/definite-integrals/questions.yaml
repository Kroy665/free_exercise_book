  stem:
    en: 'Consider the following statements, where $f$ is continuous on $\R$:'
  statements:
  - en: '$\displaystyle\int_a^b f(x)\,dx = \int_a^b f(a + b - x)\,dx$ for all $a, b$.'
  - en: 'If $f$ is odd, then $\displaystyle\int_{-a}^{a} f(x)\,dx = 2\int_0^{a} f(x)\,dx$.'
  - en: 'If $f$ has period $T$, then $\displaystyle\int_a^{a + T} f(x)\,dx$ does not depend on $a$.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: 1 only
  - en: 1 and 3 only
  - en: 2 and 3 only
  - en: '1, 2 and 3'
  answer: 1
  explanation:
    en: |-
      - **1 is true:** substitute $x = a + b - t$; the limits swap and $dx = -dt$ swaps them back.
      - **2 is false:** for odd $f$ the integral is $0$; $2\int_0^a f$ is the rule for **even** $f$. Counterexample: $f(x) = x$, $a = 1$ gives $0 \ne 1$.
      - **3 is true:** $\frac{d}{da}\int_a^{a + T} f = f(a + T) - f(a) = 0$.

      So 1 and 3 only.
  status: ai-generated
