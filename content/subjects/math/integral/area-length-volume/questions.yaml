  stem:
    en: 'The area of the region bounded by $y = x$ and $y = x^2$ is'
  options:
  - en: '$\tfrac13$'
  - en: '$\tfrac12$'
  - en: '$\tfrac16$'
  - en: '$\tfrac56$'
  answer: 2
  explanation:
    en: |-
      The curves meet where $x = x^2$, i.e. at $x = 0$ and $x = 1$, and $x \ge x^2$ on $[0, 1]$. So
      $$A = \int_0^1 (x - x^2)\,dx = \frac12 - \frac13 = \frac16.$$
      $\frac13$ is only the area under $y = x^2$; $\frac56$ adds the two areas instead of subtracting.
  status: ai-generated
