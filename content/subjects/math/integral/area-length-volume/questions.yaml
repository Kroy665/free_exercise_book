      $$A = \int_0^{2\pi} x\,\dot y\,dt = \int_0^{2\pi} 6\cos^2 t\,dt = 6\pi = \pi ab, \quad a = 3,\ b = 2.$$
      $36\pi$ uses $a^2 b^2$ in place of $ab$ (with $a = 3$, $b = 2$, $\pi a^2b^2 = 36\pi$); $12\pi$ doubles the true value.
