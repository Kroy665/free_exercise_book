      The factor is $\frac{1}{2a} = \frac16$, not $\frac1a$. The reversed fraction is $\int\frac{dx}{9 - x^2}$, which has the opposite sign. $\tan^{-1}$ belongs to $x^2 + 9$, not $x^2 - 9$.
