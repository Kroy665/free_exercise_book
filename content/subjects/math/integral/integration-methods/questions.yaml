  stem:
    en: '$\int\operatorname{cosec} x\,dx$ equals'
  options:
  - en: '$\ln\lvert\operatorname{cosec} x + \cot x\rvert + C$'
  - en: '$\ln\lvert\sin x\rvert + C$'
  - en: '$-\operatorname{cosec} x\cot x + C$'
  - en: '$\ln\left\lvert\tan\frac{x}{2}\right\rvert + C$'
  answer: 3
  explanation:
    en: |-
      Write $\operatorname{cosec} x = \dfrac{1}{2\sin\frac{x}{2}\cos\frac{x}{2}} = \dfrac{\frac12\sec^2\frac{x}{2}}{\tan\frac{x}{2}}$, which is $\frac{f'}{f}$ with $f = \tan\frac{x}{2}$:
      $$\int\operatorname{cosec} x\,dx = \ln\left\lvert\tan\frac{x}{2}\right\rvert + C = \ln\lvert\operatorname{cosec} x - \cot x\rvert + C.$$

      $\ln\lvert\operatorname{cosec} x + \cot x\rvert$ has the wrong sign: it equals $-\ln\lvert\tan\frac{x}{2}\rvert$, so its derivative is $-\operatorname{cosec} x$. $\ln\lvert\sin x\rvert$ is $\int\cot x\,dx$, and $-\operatorname{cosec} x\cot x$ is the **derivative** of $\operatorname{cosec} x$.
  status: ai-generated
