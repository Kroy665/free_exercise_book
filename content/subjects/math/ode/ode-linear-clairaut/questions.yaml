    en: |-
      Standard form: $\dfrac{dy}{dx} - \dfrac{2}{x}y = x^2$, so $P = -\dfrac2x$ and
      $$\text{IF} = e^{\int -2/x\,dx} = e^{-2\ln x} = \frac{1}{x^2}.$$
      $x^2$ ignores the minus sign in $P$; $e^{-2x}$ forgets to divide by $x$ before reading off $P$.
