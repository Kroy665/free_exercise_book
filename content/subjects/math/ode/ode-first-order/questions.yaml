  stem:
    en: Which of the following differential equations is linear?
  options:
  - en: '$y\frac{d^2y}{dx^2} + \frac{dy}{dx} = 0$'
  - en: '$\frac{d^2y}{dx^2} + \sin y = 0$'
  - en: '$\left(\frac{dy}{dx}\right)^2 + y = x$'
  - en: '$\frac{d^2y}{dx^2} + x^2y = \sin x$'
  answer: 3
  explanation:
    en: |-
      An ODE is linear when $y$ and its derivatives appear only to the first power, are not multiplied together, and have coefficients depending on $x$ alone.

      $y'' + x^2y = \sin x$ qualifies: the coefficient $x^2$ and the right side $\sin x$ involve only $x$.

      The others fail: $yy''$ is a product of $y$ and $y''$; $\sin y$ is not first-degree in $y$; $(y')^2$ is a square.
