  stem:
    en: 'The order and degree of $\left[1 + \left(\frac{dy}{dx}\right)^2\right]^{3/2} = \frac{d^2y}{dx^2}$ are respectively'
  options:
  - en: '$2$ and $1$'
  - en: '$2$ and $\frac{3}{2}$'
  - en: '$2$ and $2$'
  - en: '$1$ and $3$'
  answer: 2
  explanation:
    en: |-
      The highest derivative is $y''$, so the order is $2$. Make the equation polynomial in the derivatives by squaring:
      $$\left(1 + y'^2\right)^3 = \left(y''\right)^2.$$
      The highest-order derivative $y''$ now appears to the power $2$, so the degree is $2$.

      Reading the degree before removing the radical gives $1$; $\frac32$ is not a degree at all (degree is a positive integer); $3$ is the power of $(1 + y'^2)$, which involves the lower derivative $y'$.
  status: ai-generated
