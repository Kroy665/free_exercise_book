  - en: 'the order is $1$ and the degree is $1$'
  - en: 'the order is $2$ and the degree is $2$'
  - en: 'the order is $2$ and the degree is not defined'
  answer: 3
  explanation:
    en: |-
      The order is $2$ (highest derivative $y''$). The degree is defined only when the equation can be written as a polynomial in **all** the derivatives. Here $y'$ sits inside $\sin$, and $\sin y'$ is not a polynomial in $y'$, so the degree is **not defined**.

      Answering "degree $1$" looks only at $y''$ and ignores the requirement that the whole equation be polynomial in the derivatives.
