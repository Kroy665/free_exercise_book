  exams: *id001
  refs:
  - induction
  - exam-tips
  stem:
    en: 'The largest positive integer that divides $n^5 - n$ for every integer $n$ is'
  options:
  - en: '$5$'
  - en: '$30$'
  - en: '$10$'
  - en: '$60$'
  answer: 1
  explanation:
    en: |-
      At $n = 2$: $2^5 - 2 = 30$, so the answer is at most $30$.

      Now $n^5 - n = (n - 1)n(n + 1)(n^2 + 1)$.
      - $(n - 1)n(n + 1)$ is a product of three consecutive integers, so $6$ divides it.
      - For $5$: if $n$ leaves remainder $0, 1, 4$ on division by $5$, one of $n, n - 1, n + 1$ is a multiple of $5$; if the remainder is $2$ or $3$, then $n^2 + 1$ is (e.g. $4 + 1$, $9 + 1$).

      So $30 \mid n^5 - n$ always, and the answer is $30$. $60$ fails at $n = 2$.
  status: ai-generated
- id: q0014
  type: single
  difficulty: 3
  exams: *id001
  refs:
  - induction
  stem:
    en: 'The largest positive integer that divides $3^{2n+2} - 8n - 9$ for every positive integer $n$ is'
  options:
  - en: '$8$'
  - en: '$16$'
  - en: '$64$'
  - en: '$32$'
  answer: 2
  explanation:
    en: |-
      Let $f(n) = 3^{2n+2} - 8n - 9$. At $n = 1$: $f(1) = 81 - 17 = 64$, so the answer is at most $64$.

      Induction shows $64 \mid f(n)$ for all $n$:
      $$f(k + 1) - 9f(k) = -8k - 17 + 72k + 81 = 64(k + 1),$$
      so $f(k + 1) = 9f(k) + 64(k + 1)$. Hence the answer is $64$.

      $8$, $16$ and $32$ also divide every $f(n)$, but they are not the largest.
  status: ai-generated
