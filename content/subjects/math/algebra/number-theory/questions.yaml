  stem:
    en: 'If $a, b$ are positive integers with $\gcd(a, b) = 1$, then $\gcd(a + b, a - b)$ (for $a \ne b$) is'
  options:
  - en: 'always $1$'
  - en: 'always $2$'
  - en: '$1$, $2$ or $4$'
  - en: 'either $1$ or $2$'
  answer: 3
  explanation:
    en: |-
      Let $g = \gcd(a + b, a - b)$. Then $g$ divides the sum $2a$ and the difference $2b$, so
      $$g \mid \gcd(2a, 2b) = 2\gcd(a, b) = 2.$$
      So $g = 1$ or $2$, and both occur: $(a, b) = (2, 1)$ gives $\gcd(3, 1) = 1$; $(a, b) = (3, 1)$ gives $\gcd(4, 2) = 2$. Hence "always $1$" and "always $2$" are both wrong, and $4$ is impossible.
