- id: q0007
  type: single
  difficulty: 3
  exams: *id001
  refs:
  - diophantine
  stem:
    en: 'The number of solutions of $5x + 3y = 52$ in positive integers $x, y$ is'
  options:
  - en: '$2$'
  - en: '$3$'
  - en: '$4$'
  - en: '$5$'
  answer: 1
  explanation:
    en: |-
      $3y = 52 - 5x$ must leave remainder $2$ on division by $5$, so $y$ leaves remainder $4$: $y = 4, 9, 14, \ldots$ Also $3y < 52$ forces $y \le 15$.
      $$y = 4 \Rightarrow x = 8,\qquad y = 9 \Rightarrow x = 5,\qquad y = 14 \Rightarrow x = 2.$$
      So there are $3$ solutions. Equivalently, the general solution is $x = 8 - 3t$, $y = 4 + 5t$, and $x, y > 0$ allow $t = 0, 1, 2$.

      $4$ comes from also counting $t = -1$, which gives $y = -1$.
  status: ai-generated
- id: q0008
  type: single
  difficulty: 2
  exams: *id001
  refs:
  - diophantine
  stem:
    en: 'Which of the following equations has **no** solution in integers?'
  options:
  - en: '$6x + 10y = 14$'
  - en: '$6x + 10y = 15$'
  - en: '$7x + 11y = 5$'
  - en: '$12x + 18y = 30$'
  answer: 1
  explanation:
    en: |-
      $ax + by = c$ is solvable in integers if and only if $\gcd(a, b) \mid c$.

      - $6x + 10y = 15$: $\gcd = 2$, and $2 \nmid 15$. **No solution** (the left side is always even).
      - $6x + 10y = 14$: $2 \mid 14$; e.g. $(-1, 2)$.
      - $7x + 11y = 5$: $\gcd = 1$; e.g. $(-15, 10)$.
      - $12x + 18y = 30$: $\gcd = 6 \mid 30$; e.g. $(1, 1)$.
  status: ai-generated
