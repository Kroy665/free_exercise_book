  assertion:
    en: 'The equation $x^4 + 3x^2 + 2 = 0$ has no real root.'
  reason:
    en: A polynomial equation of even degree with real coefficients need not have a real root.
  answer: 1
  explanation:
    en: |-
      A is true: for real $x$, $x^4 + 3x^2 + 2 \ge 2 > 0$. (Descartes agrees: neither $f(x)$ nor $f(-x)$ has a sign change, and $f(0) \ne 0$.)

      R is true ($x^2 + 1 = 0$ is an example), but "need not have" says nothing about this particular equation. So R does not explain A.
