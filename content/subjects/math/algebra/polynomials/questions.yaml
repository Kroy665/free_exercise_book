  left:
  - en: '$x^3 + x + 1 = 0$'
  - en: '$x^4 + x^2 + 1 = 0$'
  - en: '$x^3 - 3x + 1 = 0$'
  - en: '$x^4 - 1 = 0$'
  right:
  - en: no real root
  - en: exactly one real root
  - en: exactly two real roots
  - en: three real roots
  options:
  - en: 'A-4, B-1, C-2, D-3'
  - en: 'A-2, B-3, C-4, D-1'
  - en: 'A-2, B-1, C-4, D-3'
  - en: 'A-2, B-1, C-3, D-4'
  answer: 2
  explanation:
    en: |-
      - **A.** $f(x)$ has no sign change, $f(-x) = -x^3 - x + 1$ has one: exactly one (negative) real root. **(2)**
      - **B.** All terms are positive for real $x$, so there is no real root. **(1)**
      - **C.** $f'(x) = 3x^2 - 3$ vanishes at $\pm1$; $f(-1) = 3 > 0$ and $f(1) = -1 < 0$, with $f(\mp\infty) = \mp\infty$. Three sign changes, three real roots. **(4)**
      - **D.** $x^4 - 1 = (x - 1)(x + 1)(x^2 + 1)$: two real roots $\pm1$. **(3)**
