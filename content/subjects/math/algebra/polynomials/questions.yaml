  stem:
    en: 'Let $f(x)$ be a polynomial with real coefficients and $f(0) \ne 0$. Consider the following statements about Descartes'' rule of signs:'
  statements:
  - en: 'The number of positive roots of $f(x) = 0$ equals the number of sign changes in its coefficients, or is less than it by an even number.'
  - en: 'If the coefficients of $f(x)$ have exactly one sign change, then $f(x) = 0$ has exactly one positive root.'
  - en: 'If the coefficients of $f(x)$ have exactly two sign changes, then $f(x) = 0$ has exactly two positive roots.'
  question:
