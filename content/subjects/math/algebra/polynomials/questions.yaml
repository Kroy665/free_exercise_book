  assertion:
    en: 'The equation $x^3 - 3x + 2 = 0$ has a repeated root.'
  reason:
    en: 'Every root of $f''(x) = 0$ is a repeated root of $f(x) = 0$.'
  answer: 2
  explanation:
    en: |-
      A is true: $x^3 - 3x + 2 = (x - 1)^2(x + 2)$, with $1$ a double root.

      R is false. The correct statement is the converse: a repeated root of $f$ is a root of $f'$. Here $f'(x) = 3x^2 - 3$ has the root $-1$, but $f(-1) = -1 + 3 + 2 = 4 \ne 0$.
