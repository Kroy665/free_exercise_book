  assertion:
    en: 'Since $i$ is a root of $x^2 - (2 + i)x + 2i = 0$, the number $-i$ is also a root.'
  reason:
    en: Non-real roots of a polynomial equation with real coefficients occur in conjugate pairs.
  answer: 3
  explanation:
    en: |-
      A is false: $x^2 - (2 + i)x + 2i = (x - 2)(x - i)$, so the roots are $2$ and $i$, and $-i$ is not a root ($(-i)^2 + (2 + i)i + 2i = -1 + 2i - 1 + 2i = -2 + 4i \ne 0$).

      R is true, but it does not apply: the coefficients $-(2 + i)$ and $2i$ are not real.
