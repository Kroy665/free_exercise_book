  stem:
    en: 'The remainder when $x^{101}$ is divided by $x^2 - 1$ is'
  options:
  - en: '$1$'
  - en: '$x$'
  - en: '$-x$'
  - en: '$x + 1$'
  answer: 1
  explanation:
    en: |-
      Write $x^{101} = (x^2 - 1)q(x) + ax + b$.

      - $x = 1$: $1 = a + b$.
      - $x = -1$: $-1 = -a + b$.

      So $b = 0$, $a = 1$, and the remainder is $x$.

      Fast check: $x^{101} = x\,(x^2)^{50}$, and $x^2 \equiv 1 \pmod{x^2 - 1}$, so $x^{101} \equiv x$. The answer $1$ is right for an even power such as $x^{100}$.
  status: ai-generated
- id: q0006
  type: single
  difficulty: 1
  exams: *id001
  refs:
  - fundamental-theorem
  stem:
    en: 'By the fundamental theorem of classical algebra, a polynomial equation of degree $n \ge 1$ with complex coefficients has'
  options:
  - en: 'exactly $n$ distinct roots in $\C$'
  - en: 'exactly $n$ roots in $\C$, counted with multiplicity'
  - en: 'at least $n$ real roots'
  - en: 'at most $n - 1$ roots in $\C$'
  answer: 1
  explanation:
    en: |-
      The theorem says every non-constant polynomial over $\C$ has at least one root in $\C$. Applying it repeatedly with the factor theorem gives
      $$f(x) = a_0(x - \alpha_1)(x - \alpha_2)\cdots(x - \alpha_n),$$
      so there are exactly $n$ roots **counted with multiplicity**.

      The roots need not be distinct: $(x - 1)^2 = 0$ has degree 2 but only one distinct root.
  status: ai-generated
