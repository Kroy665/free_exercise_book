  stem:
    en: 'Consider the following statements about polynomial equations:'
  statements:
  - en: Every cubic equation with real coefficients has at least one real root.
  - en: 'If $\alpha$ is a non-real root of a polynomial equation with complex coefficients, then $\bar\alpha$ is also a root.'
  - en: 'If $1 + \sqrt2$ is a root of a polynomial equation with rational coefficients, then $1 - \sqrt2$ is also a root.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: 1 only
  - en: 2 and 3 only
  - en: '1, 2 and 3'
  - en: 1 and 3 only
  answer: 3
  explanation:
    en: |-
      1. True. Non-real roots of a real polynomial come in conjugate pairs, so the number of non-real roots is even and a cubic has at least one real root.
      2. False. The conjugate-pair theorem needs **real** coefficients. Counterexample: $x - i = 0$ has the root $i$ but not $-i$.
      3. True. With rational coefficients, $a + \sqrt b$ and $a - \sqrt b$ (with $\sqrt b$ irrational) occur together.
  status: ai-generated
