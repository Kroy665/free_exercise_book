- id: q0024
  type: statements
  difficulty: 3
  exams: *id001
  refs:
  - multiple-roots
  - rolle-location
  stem:
    en: 'Let $f(x)$ be a polynomial of degree $n \ge 2$ with real coefficients. Consider the following statements:'
  statements:
  - en: 'If $\alpha$ is a root of $f(x) = 0$ of multiplicity exactly $2$, then $f(\alpha) = f''(\alpha) = 0$ and $f''''(\alpha) \ne 0$.'
  - en: 'Between any two real roots of $f''(x) = 0$ there lies a real root of $f(x) = 0$.'
  - en: 'If all $n$ roots of $f(x) = 0$ are real and distinct, then all roots of $f''(x) = 0$ are real and distinct.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: '1, 2 and 3'
  - en: 1 only
  - en: 1 and 3 only
  - en: 2 and 3 only
  answer: 2
  explanation:
    en: |-
      1. True. $\alpha$ has multiplicity $r$ exactly when $f, f', \ldots, f^{(r-1)}$ vanish at $\alpha$ and $f^{(r)}(\alpha) \ne 0$.
      2. False: Rolle's theorem goes the other way (a root of $f'$ between two roots of $f$). Counterexample: $f(x) = x^3 - 3x + 5$ has $f'(x) = 0$ at $\pm1$, but $f(-1) = 7$ and $f(1) = 3$ are both positive and $f$ is decreasing on $[-1, 1]$, so there is no root of $f$ in between.
      3. True. Rolle gives a root of $f'$ in each of the $n - 1$ gaps between consecutive roots of $f$; these are distinct and $f'$ has degree $n - 1$, so they are all its roots.
  status: ai-generated
