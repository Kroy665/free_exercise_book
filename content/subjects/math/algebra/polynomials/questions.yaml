  stem:
    en: 'A monic polynomial $f(x)$ of degree $4$ satisfies $f(1) = 1$, $f(2) = 2$, $f(3) = 3$ and $f(4) = 4$. Then $f(5)$ equals'
  options:
  - en: '$5$'
  - en: '$24$'
  - en: '$30$'
  - en: '$29$'
  answer: 3
  explanation:
    en: |-
      Let $g(x) = f(x) - x$. Then $g$ is monic of degree 4 and vanishes at $1, 2, 3, 4$. By the factor theorem
      $$g(x) = (x - 1)(x - 2)(x - 3)(x - 4).$$
      So $f(5) = g(5) + 5 = 4\cdot3\cdot2\cdot1 + 5 = 29$.

      The answer $5$ assumes $f(x) = x$, which is not of degree 4. The answer $24$ forgets to add back the $x$.
