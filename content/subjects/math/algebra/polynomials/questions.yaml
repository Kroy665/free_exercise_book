  stem:
    en: 'The monic cubic with real coefficients having $2$ and $1 + i$ as roots is'
  options:
  - en: '$x^3 - 2x - 4$'
  - en: '$x^3 - 4x^2 + 6x - 4$'
  - en: '$x^3 - 2x + 4$'
  - en: '$x^3 - 4x^2 + 6x + 4$'
  answer: 1
  explanation:
    en: |-
      Real coefficients force the conjugate $1 - i$ to be a root too. The pair gives the quadratic factor
      $$(x - 1 - i)(x - 1 + i) = (x - 1)^2 + 1 = x^2 - 2x + 2.$$
      So
      $$f(x) = (x - 2)(x^2 - 2x + 2) = x^3 - 4x^2 + 6x - 4.$$

      $x^3 - 2x - 4 = (x - 2)(x^2 + 2x + 2)$ has roots $-1 \pm i$, a sign slip in the quadratic factor. Check: the product of the roots is $2(1 + i)(1 - i) = 4 = -(-4)$.
  status: ai-generated
