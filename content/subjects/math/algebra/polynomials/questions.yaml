      | $\times 1$ | | $2$ | $-1$ | $3$ |
      | | $2$ | $-1$ | $3$ | $-2$ |

      So the quotient is $2x^2 - x + 3$ and the remainder is $-2$. Check: $f(1) = 2 - 3 + 4 - 5 = -2$.

      The option with remainder $-14$ is the result of using the multiplier $-1$, that is, dividing by $x + 1$.
