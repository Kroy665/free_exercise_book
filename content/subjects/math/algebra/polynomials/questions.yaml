  stem:
    en: 'A polynomial $f(x)$ leaves remainder $3$ when divided by $x - 1$ and remainder $5$ when divided by $x - 2$. The remainder when $f(x)$ is divided by $(x - 1)(x - 2)$ is'
  options:
  - en: '$2x + 1$'
  - en: '$x + 2$'
  - en: '$2x - 1$'
  - en: '$3x + 5$'
  answer: 0
  explanation:
    en: |-
      The divisor has degree 2, so the remainder is $ax + b$:
      $$f(x) = (x - 1)(x - 2)q(x) + ax + b.$$
      Put $x = 1$ and $x = 2$: $a + b = 3$ and $2a + b = 5$. So $a = 2$, $b = 1$, and the remainder is $2x + 1$.

      Check: $2(1) + 1 = 3$ and $2(2) + 1 = 5$. The option $x + 2$ swaps $a$ and $b$; it gives $4$ at $x = 2$, not $5$.
