      **Checks:**
      - the new sum of roots is $\sum\alpha\beta = p$
      - the new product is $(\alpha\beta\gamma)^2 = q^2$
      - the middle coefficient is $\sum(\alpha\beta)(\beta\gamma) = \alpha\beta\gamma\sum\alpha = 0$

