      $$(y - 1)^3 - (y - 1)(y + 1)^2 - (y + 1)^3 = 0 \implies -y^3 - 7y^2 + y - 1 = 0.$$

      So $y^3 + 7y^2 - y + 1 = 0$, and the required sum is $-7$.

      $+7$ forgets the minus sign in "sum of roots $= -a_1/a_0$".
