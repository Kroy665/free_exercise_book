      **Checks:**
      - the new sum of roots is $-2 = \sum\alpha^2 = 2^2 - 2\cdot3$
      - the new product is $1 = (\alpha\beta\gamma)^2$, so the constant term must be $-1$, not $+1$

      $13$ comes from $q^2 + 2pr$ instead of $q^2 - 2pr$.
