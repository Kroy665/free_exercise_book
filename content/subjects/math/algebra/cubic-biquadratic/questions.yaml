  stem:
    en: 'In Cardan''s method for $y^3 + 3Hy + G = 0$, put $y = u + v$ with $uv = -H$. Then $u^3$ and $v^3$ are the roots of'
  options:
  - en: '$t^2 - Gt - H^3 = 0$'
  - en: '$t^2 + Gt - H^3 = 0$'
  - en: '$t^2 + Gt + H^3 = 0$'
  - en: '$t^2 + 3Ht + G = 0$'
  answer: 1
  explanation:
    en: |-
      Since $(u + v)^3 = u^3 + v^3 + 3uv(u + v)$, the condition $uv = -H$ leaves
      $$u^3 + v^3 = -G, \qquad u^3v^3 = -H^3.$$
      A quadratic with this sum and product is $t^2 + Gt - H^3 = 0$.

      $t^2 - Gt - H^3$ uses $+G$ as the sum; $t^2 + Gt + H^3$ uses $H^3$ as the product.
