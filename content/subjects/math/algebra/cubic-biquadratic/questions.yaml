  - en: '$x = y - 2$'
  - en: '$x = y + 6$'
  - en: '$x = y + 3$'
  answer: 0
  explanation:
    en: |-
      For a monic cubic $x^3 + bx^2 + \cdots$, put $x = y - \frac{b}{3}$. Here $b = -6$, so $x = y + 2$.

      Check: the $y^2$ coefficient of $(y + 2)^3 - 6(y + 2)^2$ is $3\cdot 2 - 6 = 0$.

      $x = y - 2$ is the sign slip; $x = y + 6$ forgets to divide by $3$.
