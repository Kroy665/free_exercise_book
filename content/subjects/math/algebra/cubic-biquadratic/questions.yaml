  stem:
    en: 'The cubic $y^3 + 3Hy + G = 0$, with $H, G$ real, has one real root and two non-real roots if and only if'
  options:
  - en: '$G^2 + 4H^3 < 0$'
  - en: '$G^2 + 4H^3 = 0$'
  - en: '$G^2 + 4H^3 > 0$'
  - en: '$G^2 - 4H^3 > 0$'
  answer: 2
  explanation:
    en: |-
      The sign of $G^2 + 4H^3$, the discriminant of Cardan's quadratic $t^2 + Gt - H^3 = 0$, decides:
      - $> 0$: one real root, two non-real conjugates;
      - $= 0$: all real, at least two equal;
      - $< 0$: three distinct real roots.

      $G^2 + 4H^3 < 0$ is the irreducible case (three real roots), so it is the swapped condition.
  status: ai-generated
