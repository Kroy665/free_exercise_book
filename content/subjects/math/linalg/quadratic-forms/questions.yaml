      So $r = 3$, $p = 1$, $q = 2$ and the signature is $p - q = -1$.

      $3, 2, 1$ swaps $p$ and $q$. $3, 1, 1$ gives the index as the signature. Check: $\det A = 2 \ne 0$, so the rank is $3$, not $2$.
