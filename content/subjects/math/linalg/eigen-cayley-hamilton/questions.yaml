  answer: 1
  explanation:
    en: |-
      Eigenvalues of a real skew-symmetric matrix are $0$ or purely imaginary, and, since the matrix is real, non-real ones come in conjugate pairs. So $0, 2i, -2i$ is possible: for example, $\begin{pmatrix} 0 & -2 & 0\\ 2 & 0 & 0\\ 0 & 0 & 0\end{pmatrix}$.

      $0, \pm1$ and $1, \pm i$ contain non-zero real eigenvalues. $0, 2i, 2i$ is not closed under conjugation (and its sum $4i$ cannot be the real trace $0$).
