  stem:
    en: 'The characteristic equation of $A = \begin{pmatrix} 1 & 2\\ 3 & 4\end{pmatrix}$ is'
  options:
  - en: '$\lambda^2 + 5\lambda - 2 = 0$'
  - en: '$\lambda^2 - 5\lambda + 2 = 0$'
  - en: '$\lambda^2 - 5\lambda - 2 = 0$'
  - en: '$\lambda^2 - 5\lambda + 10 = 0$'
  answer: 2
  explanation:
    en: |-
      For a $2 \times 2$ matrix, $\chi_A(\lambda) = \lambda^2 - (\operatorname{tr} A)\lambda + \det A$.

      Here $\operatorname{tr} A = 5$ and $\det A = 4 - 6 = -2$, so
      $$\lambda^2 - 5\lambda - 2 = 0.$$

      $\lambda^2 - 5\lambda + 10$ comes from adding the cross product instead of subtracting it ($4 + 6$); $\lambda^2 + 5\lambda - 2$ has the wrong sign on the trace term.
  status: ai-generated
