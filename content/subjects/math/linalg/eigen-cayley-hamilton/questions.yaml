    en: 'For $A = \begin{pmatrix} 3 & 1 & 1\\ 0 & 3 & 0\\ 0 & 0 & 3\end{pmatrix}$, the algebraic and geometric multiplicities of the eigenvalue $3$ are, respectively,'
