  stem:
    en: 'Let $A = \begin{pmatrix} 2 & 0 & 0\\ a & 2 & 0\\ b & c & 3\end{pmatrix}$ with real $a, b, c$. Then $A$ is diagonalisable if and only if'
  options:
  - en: '$c = 0$'
  - en: '$b = 0$'
  - en: '$a = b = c = 0$'
  - en: '$a = 0$'
  answer: 3
  explanation:
    en: |-
      The eigenvalues are $2, 2, 3$. The simple eigenvalue $3$ causes no trouble; $A$ is diagonalisable iff the geometric multiplicity of $2$ is $2$, i.e. $\operatorname{rank}(A - 2I) = 1$.

      $$A - 2I = \begin{pmatrix} 0 & 0 & 0\\ a & 0 & 0\\ b & c & 1\end{pmatrix}.$$
      The third row is non-zero. If $a \neq 0$, rows 2 and 3 are independent (rank $2$); if $a = 0$, the rank is $1$.

      So the condition is $a = 0$, whatever $b$ and $c$ are. "$a = b = c = 0$" is sufficient but not necessary.
