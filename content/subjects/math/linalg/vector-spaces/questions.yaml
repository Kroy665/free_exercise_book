  assertion:
    en: A matrix and its row echelon form have the same row space.
  reason:
    en: Elementary row operations do not change the column space of a matrix.
  answer: 2
  explanation:
    en: |-
      A is true: each new row is a linear combination of the old rows, and each row operation can be reversed, so the row spans are equal.

      R is false. For $\begin{pmatrix}1 & 2\\ 2 & 4\end{pmatrix} \to \begin{pmatrix}1 & 2\\ 0 & 0\end{pmatrix}$, the column space changes from $L\{(1, 2)\}$ to $L\{(1, 0)\}$. Row operations preserve only the **dimension** of the column space and the linear relations among the columns.
