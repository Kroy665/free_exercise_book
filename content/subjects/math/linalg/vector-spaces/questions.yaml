  options:
  - en: '$W_1 \cap W_2 = \{0\}$'
  - en: '$W_1 + W_2 = V$'
  - en: '$W_1 \cap W_2 \ne \{0\}$'
  - en: '$W_1 \subseteq W_2$ or $W_2 \subseteq W_1$'
  answer: 3
  explanation:
    en: |-
      If $u \in W_1 \setminus W_2$ and $v \in W_2 \setminus W_1$, then $u + v$ lies in neither: $u + v \in W_1$ would give $v = (u + v) - u \in W_1$, and similarly for $W_2$. So the union is closed under addition only when one subspace contains the other; conversely, then the union is just the larger subspace.

      The $x$- and $y$-axes in $\R^2$ meet only in $\{0\}$ and their sum is $\R^2$, yet their union is not a subspace; so the other conditions are wrong.
