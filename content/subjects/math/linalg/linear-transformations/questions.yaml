  stem:
    en: 'Which of the following maps $T : \R^2 \to \R^2$ is linear?'
  options:
  - en: '$T(x, y) = (x + 1,\ y)$'
  - en: '$T(x, y) = (x + y,\ x - y)$'
  - en: '$T(x, y) = (x^2,\ y)$'
  - en: '$T(x, y) = (xy,\ x)$'
  answer: 1
  explanation:
    en: |-
      Each coordinate of $(x + y,\ x - y)$ is a linear form in $x, y$ with no constant term, so
      $$T(\alpha u + \beta v) = \alpha T(u) + \beta T(v).$$
      The others fail:
      - $(x + 1, y)$ is a translation: $T(0, 0) = (1, 0) \ne 0$.
      - $(x^2, y)$: $T(2, 0) = (4, 0) \ne 2T(1, 0) = (2, 0)$.
      - $(xy, x)$: $T(1,1) + T(1,1) = (2, 2)$ but $T(2, 2) = (4, 2)$. It fixes $0$, yet is not linear.
  status: ai-generated
