  options:
  - en: '$3$'
  - en: '$5$'
  - en: '$2$'
  - en: '$0$'
  answer: 2
  explanation:
    en: |-
      Onto means $\rho(T) = \dim \R^3 = 3$. By rank–nullity (the sum is the dimension of the **domain**):
      $$\nu(T) = 5 - 3 = 2.$$
      $3$ confuses nullity with rank; $0$ would make $T$ one-one, impossible since $5 > 3$.
  status: ai-generated
