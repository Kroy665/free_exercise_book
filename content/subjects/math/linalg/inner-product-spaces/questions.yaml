  stem:
    en: '$e_1 = \tfrac{1}{\sqrt2}(1, 1)$ and $e_2 = \tfrac{1}{\sqrt2}(1, -1)$ form an orthonormal basis of $\R^2$. The Fourier coefficients $\big(\langle v, e_1\rangle, \langle v, e_2\rangle\big)$ of $v = (3, 1)$ are'
