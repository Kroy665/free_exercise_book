- id: q0009
  type: single
  difficulty: 2
  exams: *id001
  refs:
  - inner-products
  stem:
    en: 'For $x = (x_1, x_2)$, $y = (y_1, y_2)$ in $\R^2$, which of the following defines an inner product?'
  options:
  - en: '$x_1y_1 - x_2y_2$'
  - en: '$x_1y_2 + x_2y_1$'
  - en: '$x_1y_1 + 2x_1y_2 + x_2y_1 + x_2y_2$'
  - en: '$x_1y_1 - x_1y_2 - x_2y_1 + 3x_2y_2$'
  answer: 3
  explanation:
    en: |-
      Write each form as $x^T M y$; it is an inner product iff $M$ is symmetric and positive definite.

      - $M = \begin{pmatrix} 1 & -1\\ -1 & 3\end{pmatrix}$: symmetric, $1 > 0$, $\det M = 2 > 0$. **Inner product.**
      - $x_1y_1 - x_2y_2$: $\langle (0, 1), (0, 1)\rangle = -1 < 0$.
      - $x_1y_2 + x_2y_1$: $\langle (1, 0), (1, 0)\rangle = 0$ for a non-zero vector.
      - $x_1y_1 + 2x_1y_2 + x_2y_1 + x_2y_2$: not symmetric, e.g. $\langle e_1, e_2\rangle = 2 \ne 1 = \langle e_2, e_1\rangle$.
  status: ai-generated
- id: q0010
  type: single
  difficulty: 2
