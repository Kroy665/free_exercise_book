- id: q0022
  type: statements
  difficulty: 3
  exams: *id001
  refs:
  - orthogonality
  - inner-products
  stem:
    en: 'Let $V$ be a complex inner product space, with $\langle\cdot,\cdot\rangle$ linear in the first argument. Consider the following statements:'
  statements:
  - en: '$\langle u, \alpha v\rangle = \bar\alpha\langle u, v\rangle$ for all $u, v \in V$, $\alpha \in \C$.'
  - en: 'If $\|u + v\|^2 = \|u\|^2 + \|v\|^2$, then $u \perp v$.'
  - en: 'Every orthogonal set of non-zero vectors in $V$ is linearly independent.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: 1 and 3 only
  - en: '1, 2 and 3'
  - en: 1 and 2 only
  - en: 3 only
  answer: 0
  explanation:
    en: |-
      1. True: $\langle u, \alpha v\rangle = \overline{\langle \alpha v, u\rangle} = \overline{\alpha\langle v, u\rangle} = \bar\alpha\langle u, v\rangle$.
      2. False: $\|u + v\|^2 = \|u\|^2 + 2\operatorname{Re}\langle u, v\rangle + \|v\|^2$ forces only $\operatorname{Re}\langle u, v\rangle = 0$. In $\C$: $u = 1$, $v = i$ give $\|1 + i\|^2 = 2 = 1 + 1$, but $\langle 1, i\rangle = \bar i = -i \ne 0$.
      3. True: if $\sum c_j v_j = 0$, take the inner product with $v_i$: $c_i\|v_i\|^2 = 0$, so $c_i = 0$.

      Statement 2 is true in a **real** space, which is the trap.
  status: ai-generated
- id: q0023
  type: statements
