  stem:
    en: 'Consider the following statements:'
  statements:
  - en: '$\langle f, g\rangle = \int_0^1 f(x)g(x)\,dx$ is an inner product on $C[0, 1]$.'
  - en: '$\langle p, q\rangle = p(0)q(0) + p(1)q(1)$ is an inner product on the space of real polynomials of degree $\le 1$.'
  - en: '$\langle A, B\rangle = \operatorname{tr}(A^TB)$ is an inner product on the space of real $n \times n$ matrices.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: 1 and 3 only
  - en: 1 and 2 only
  - en: 2 and 3 only
  - en: '1, 2 and 3'
  answer: 3
  explanation:
    en: |-
      1. True: bilinear, symmetric, and $\int_0^1 f^2 = 0$ forces $f \equiv 0$ because $f$ is **continuous**.
      2. True: bilinear and symmetric; $\langle p, p\rangle = p(0)^2 + p(1)^2 = 0$ means $p$ has two roots $0$ and $1$, and a polynomial of degree $\le 1$ with two roots is $0$.
      3. True: $\operatorname{tr}(A^TB) = \sum_{i,j}a_{ij}b_{ij}$ is the dot product of the entries.

      The tempting "1 and 3 only" treats 2 as on degree $\le 2$, where $p = x(x - 1)$ would break positivity.
