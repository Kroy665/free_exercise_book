  - exam-tips
  stem:
    en: '$\langle x, y\rangle = x_1y_1 + k(x_1y_2 + x_2y_1) + 4x_2y_2$ is an inner product on $\R^2$ if and only if'
  options:
  - en: '$-2 \le k \le 2$'
  - en: '$-2 < k < 2$'
  - en: '$-4 < k < 4$'
  - en: '$0 < k < 2$'
  answer: 1
  explanation:
    en: |-
      The matrix is $M = \begin{pmatrix} 1 & k\\ k & 4\end{pmatrix}$, symmetric for every $k$. Positive definite iff $1 > 0$ and $\det M = 4 - k^2 > 0$, i.e. $-2 < k < 2$.

      At $k = 2$, the non-zero vector $x = (2, -1)$ gives $\langle x, x\rangle = 4 - 8 + 4 = 0$ (similarly $(2, 1)$ at $k = -2$), so positivity fails: the endpoints must be excluded. $-4 < k < 4$ compares $k$ with $4$ instead of $k^2$.
  status: ai-generated
