- id: q0001
  type: single
  difficulty: 1
  exams: &id001
  - slst-0910
  - slst-1112
  refs:
  - matrix-form
  stem:
    en: 'A system $AX = B$ of $m$ linear equations in $n$ unknowns is consistent if and only if'
  options:
  - en: '$\rho(A) = n$'
  - en: '$\det A \ne 0$'
  - en: '$\rho(A) = \rho([A \mid B])$'
  - en: '$\rho([A \mid B]) = \rho(A) + 1$'
  answer: 2
  explanation:
    en: |-
      By the Rouché–Capelli theorem, $AX = B$ has a solution exactly when $B$ lies in the column space of $A$, that is, when
      $$\rho(A) = \rho([A \mid B]).$$

      - $\rho(A) = n$ concerns **uniqueness**, not existence: $x + y = 1$, $x + y = 2$, $x - y = 0$ has $\rho(A) = 2 = n$ but no solution.
      - $\det A \ne 0$ is sufficient (for square $A$) but not necessary: $x + y = 2$, $2x + 2y = 4$ is consistent with $\det A = 0$.
      - $\rho([A\mid B]) = \rho(A) + 1$ is precisely the **inconsistent** case.
  status: ai-generated
