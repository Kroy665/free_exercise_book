  stem:
    en: 'For matrices $A$ ($m\times n$) and $B$ ($n\times p$), $(AB)^T$ equals'
  options:
  - en: '$A^TB^T$'
  - en: '$B^TA^T$'
  - en: '$AB$'
  - en: '$BA$'
  answer: 1
  explanation:
    en: |-
      The reversal law: $\big((AB)^T\big)_{ij} = (AB)_{ji} = \sum_k a_{jk}b_{ki} = \sum_k (B^T)_{ik}(A^T)_{kj}$, so
      $$(AB)^T = B^TA^T.$$
      $A^TB^T$ is not even defined here unless $p = m$ (it would be $(n\times m)(p\times n)$).
