- id: q0022
  type: statements
  difficulty: 2
  exams: *id001
  refs:
  - direction-cosines
  stem:
    en: 'Consider the following statements about direction cosines:'
  statements:
  - en: 'There is a line making angles $45^\circ$, $60^\circ$ and $120^\circ$ with the positive $x$-, $y$- and $z$-axes respectively.'
  - en: 'There is a line making angles $30^\circ$, $45^\circ$ and $60^\circ$ with the positive $x$-, $y$- and $z$-axes respectively.'
  - en: 'If $l, m, n$ are the direction cosines of a line, then $l + m + n \le \sqrt3$.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: 1 only
  - en: 1 and 3 only
  - en: 2 and 3 only
  - en: '1, 2 and 3'
  answer: 1
  explanation:
    en: |-
      Angles $\alpha, \beta, \gamma$ are possible iff $\cos^2\alpha + \cos^2\beta + \cos^2\gamma = 1$.

      1. True: $\tfrac12 + \tfrac14 + \tfrac14 = 1$.
      2. False: $\tfrac34 + \tfrac12 + \tfrac14 = \tfrac32 \ne 1$.
      3. True: by Cauchy–Schwarz, $l + m + n \le \sqrt3\sqrt{l^2 + m^2 + n^2} = \sqrt3$, with equality for $l = m = n = \tfrac{1}{\sqrt3}$.
  status: ai-generated
