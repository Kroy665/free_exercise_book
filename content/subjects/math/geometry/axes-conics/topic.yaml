id: math.geometry.axes-conics
title:
  en: Transformation of Axes and General Conics
summary:
  en: Translation and rotation of rectangular axes, the invariants a + b, ab − h² and Δ, removing the xy-term, the centre of a conic, reduction of the general second-degree equation to canonical form, classification of conics, and the standard properties of the ellipse, parabola and hyperbola.
order: 1
exams: [slst-0910, slst-1112]
prerequisites: [math.linalg.quadratic-forms]
estimated_minutes: 70
