  - J. G. Chakravorty and P. R. Ghosh, Advanced Analytical Geometry, chs. on transformation of axes and reduction of the general equation
  - R. K. Ghosh and K. C. Maity, An Introduction to Analytical Geometry and Vector Analysis, chs. on conics
  - WBSSC 2nd SLST syllabus, Mathematics (GRAD) II.A.1–2 and (PG) IV.A
