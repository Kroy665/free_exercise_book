      $(\sqrt2, \sqrt2)$ rotates the **point** anticlockwise instead of the axes (that is the same as rotating the axes clockwise). $(1, -1)$ forgets the factor $2$. Check: the distance from the origin stays $2$, and $\sqrt{2 + 2} = 2$.
