  assertion:
    en: 'Under a translation of axes, the coefficient of $xy$ in a second-degree equation in general changes.'
  reason:
    en: 'Under $x = X + \alpha$, $y = Y + \beta$, the second-degree terms $ax^2 + 2hxy + by^2$ keep their coefficients $a, h, b$.'
  answer: 3
  explanation:
    en: |-
      Substitute: $a(X + \alpha)^2 + 2h(X + \alpha)(Y + \beta) + b(Y + \beta)^2$. The only second-degree terms are
      $$aX^2 + 2hXY + bY^2;$$
      everything else is linear or constant. So the $xy$-coefficient **never** changes under translation: **A is false**, **R is true**.

      Removing the $xy$-term needs a **rotation**; translation only removes linear terms (by moving to the centre).
