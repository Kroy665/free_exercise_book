  stem:
    en: 'The origin is shifted to $(2, -3)$ without rotating the axes. The point whose old coordinates are $(5, 1)$ has new coordinates'
  options:
  - en: '$(7, -2)$'
  - en: '$(3, 4)$'
  - en: '$(3, -2)$'
  - en: '$(-3, -4)$'
  answer: 1
  explanation:
    en: |-
      Under translation to $(\alpha, \beta)$: $X = x - \alpha$, $Y = y - \beta$. So
      $$X = 5 - 2 = 3, \qquad Y = 1 - (-3) = 4.$$

      $(7, -2)$ adds the shift instead of subtracting it. $(3, -2)$ subtracts $3$ from $y$ instead of $-3$. $(-3, -4)$ has both signs reversed (old − new swapped). Check: $(3, 4) + (2, -3) = (5, 1)$.
  status: ai-generated
- id: q0002
  type: single
  difficulty: 1
  exams: *id001
  refs:
