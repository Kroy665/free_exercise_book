      So $3X^2 - Y^2 = 1$, a hyperbola.

      Invariant check: $a' + b' = 2 = a + b$ and $a'b' = -3 = ab - h^2 = 1 - 4$. $3X^2 + Y^2$ fails the product. $5X^2 - 3Y^2$ uses $h = 4$ (the unhalved coefficient). $4X^2 - 2Y^2$ has the right sum but product $-8$.
