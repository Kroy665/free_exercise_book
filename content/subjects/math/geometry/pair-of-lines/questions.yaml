  stem:
    en: 'The equation $6x^2 - 5xy - 6y^2 = 0$ represents'
  options:
  - en: a pair of coincident lines through the origin
  - en: a pair of perpendicular lines through the origin
  - en: 'a pair of lines through the origin inclined at $\dfrac{\pi}{4}$'
  - en: only the origin (imaginary lines)
  answer: 1
  explanation:
    en: |-
      In the form $ax^2 + 2hxy + by^2 = 0$: $a = 6$, $b = -6$, so $a + b = 0$, and the lines are **perpendicular**. Also $h^2 - ab = \tfrac{25}{4} + 36 > 0$, so they are real.

      Check by factorising: $$6x^2 - 5xy - 6y^2 = (3x + 2y)(2x - 3y),$$ with slopes $-\tfrac32$ and $\tfrac23$, whose product is $-1$.

      Coincident lines would need $h^2 = ab$, which fails here since $ab < 0$.
  status: ai-generated
