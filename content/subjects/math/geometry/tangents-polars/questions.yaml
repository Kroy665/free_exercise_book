  stem:
    en: 'The line $y = x + c$ touches the ellipse $\dfrac{x^2}{9} + \dfrac{y^2}{4} = 1$ if and only if'
  options:
  - en: '$c = \pm\sqrt5$'
  - en: '$c = \pm 13$'
  - en: '$c = \pm 5$'
  - en: '$c = \pm\sqrt{13}$'
  answer: 3
  explanation:
    en: |-
      For the ellipse the condition is $c^2 = a^2m^2 + b^2$. Here $a^2 = 9$, $b^2 = 4$, $m = 1$:
      $$c^2 = 9 + 4 = 13,\qquad c = \pm\sqrt{13}.$$
      $\pm\sqrt5$ comes from the hyperbola condition $c^2 = a^2m^2 - b^2$; $\pm 13$ forgets the square root.
