- id: q0022
  type: statements
  difficulty: 2
  exams: *id001
  refs:
  - normals
  stem:
    en: 'Consider the following statements:'
  statements:
  - en: 'At most three normals can be drawn to the parabola $y^2 = 4ax$ from any point.'
  - en: 'If three normals are drawn from a point to $y^2 = 4ax$, the sum of the ordinates of their feet is zero.'
  - en: At most four normals can be drawn to an ellipse from any point.
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: 1 and 2 only
  - en: 1 and 3 only
  - en: 2 and 3 only
  - en: '1, 2 and 3'
  answer: 3
  explanation:
    en: |-
      1. True: the normal $y = mx - 2am - am^3$ passes through $(h, k)$ iff $am^3 + (2a - h)m + k = 0$, a cubic in $m$.
      2. True: the cubic has no $m^2$ term, so $m_1 + m_2 + m_3 = 0$; the feet have ordinates $-2am_i$, which add to $0$.
      3. True: the feet are the intersections of the ellipse with a rectangular hyperbola (Apollonius), at most four points. For example, from $\left(\frac1{10}, \frac1{20}\right)$ to $\frac{x^2}{4} + y^2 = 1$ there are exactly four.

      The tempting "1 and 2 only" comes from carrying the parabola's bound of three over to the ellipse.
  status: ai-generated
