  - en: 'The polar of $(1, 2)$ with respect to $y^2 = 4x$ is $y = x + 1$.'
  - en: 'The director circle of the hyperbola $\dfrac{x^2}{9} - \dfrac{y^2}{16} = 1$ is $x^2 + y^2 = 7$.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: 1 only
  - en: 2 and 3 only
  - en: 1 and 2 only
  - en: '1, 2 and 3'
  answer: 2
  explanation:
    en: |-
