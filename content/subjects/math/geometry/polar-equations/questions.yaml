      1. True: $\frac1{SP} + \frac1{SQ} = \frac{1 + e\cos\theta}{l} + \frac{1 - e\cos\theta}{l} = \frac2l$.
      2. True: $PQ = \frac{2l}{1 - \cos^2\theta} = \frac{4a}{\sin^2\theta}$.
