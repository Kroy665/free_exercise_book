  stem:
    en: 'Consider the following statements:'
  statements:
  - en: '$r = 2a\cos\theta$ $(a > 0)$ is a circle through the pole with centre $(a, 0)$ and radius $a$.'
  - en: '$r = a$ $(a > 0)$ is a circle with centre at the pole and radius $a$.'
  - en: '$r^2 - 4r\cos\theta + 3 = 0$ is a circle with centre $(2, 0)$ and radius $\sqrt3$.'
  question:
    en: Which of the statements given above is/are correct?
  options:
  - en: '1, 2 and 3'
  - en: 2 and 3 only
  - en: 1 only
  - en: 1 and 2 only
  answer: 3
  explanation:
    en: |-
      1. True: $x^2 + y^2 = 2ax$, i.e. $(x - a)^2 + y^2 = a^2$.
      2. True: $x^2 + y^2 = a^2$.
      3. False: in $r^2 - 2cr\cos(\theta - \alpha) + c^2 - a^2 = 0$, $c = 2$ and $c^2 - a^2 = 3$, so $a = 1$. In Cartesian form, $x^2 + y^2 - 4x + 3 = 0$, i.e. $(x - 2)^2 + y^2 = 1$. The value $\sqrt3$ treats the constant as the radius squared.
  status: ai-generated
