      $$a = b = c \ne 0, \qquad f = g = h = 0.$$
      Equal squared coefficients alone are not enough: $x^2 + y^2 + z^2 + 2xy = 1$ is $(x + y)^2 + z^2 = 1$, a cylinder. The linear coefficients $u, v, w$ only move the centre.
