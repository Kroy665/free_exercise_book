  - en: '$\begin{pmatrix} 1 & -2 & 6\\ -2 & -2 & -4\\ 6 & -4 & 3\end{pmatrix}$'
  - en: '$\begin{pmatrix} 1 & -1 & -2\\ -1 & -2 & 3\\ -2 & 3 & 3\end{pmatrix}$'
