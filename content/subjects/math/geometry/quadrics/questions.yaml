    en: 'The surface $\dfrac{x^2}{4} + \dfrac{y^2}{9} - \dfrac{z^2}{16} = 1$ is'
  options:
  - en: a hyperboloid of two sheets
  - en: an elliptic cone
  - en: an elliptic paraboloid
  - en: a hyperboloid of one sheet
  answer: 3
  explanation:
    en: |-
      Count the positive squares on the left of $\ldots = 1$: there are **two** ($x^2$ and $y^2$), so it is a **hyperboloid of one sheet**.

      - One positive square would give two sheets.
      - A cone needs $0$ on the right.
      - A paraboloid has a **linear** term in one variable.

      Check: every section $z = k$ is the real ellipse $\frac{x^2}{4} + \frac{y^2}{9} = 1 + \frac{k^2}{16}$, so the surface is connected.
