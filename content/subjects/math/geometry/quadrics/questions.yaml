  stem:
    en: 'The axes are rotated about the origin, and $ax^2 + by^2 + cz^2 + 2fyz + 2gzx + 2hxy + 2ux + 2vy + 2wz + d = 0$ becomes $a''X^2 + b''Y^2 + c''Z^2 + \cdots = 0$. Which of the following is always equal to its new value?'
  options:
  - en: '$a + b$'
  - en: '$abc$'
  - en: '$a + b + c$'
  - en: '$f + g + h$'
  answer: 2
  explanation:
    en: |-
      Under a rotation $A' = P^TAP$ with $P$ orthogonal, so $A'$ has the same eigenvalues as $A$. Hence the **trace**
      $$a + b + c = \lambda_1 + \lambda_2 + \lambda_3$$
      is invariant. (So are $J = bc + ca + ab - f^2 - g^2 - h^2$ and $D = \det A$.)

      $a + b$ is invariant only for rotations about the $z$-axis. $abc$ is not $\det A$ unless $f = g = h = 0$. Example: $2xy$ (with $abc = 0$) becomes $X^2 - Y^2$ after a $45^\circ$ rotation about the $z$-axis, but $a + b + c = 0$ stays $0$.
  status: ai-generated
