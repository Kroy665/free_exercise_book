id: hist.modern.swadeshi
title:
  en: Partition of Bengal and the Swadeshi Movement
  bn: বঙ্গভঙ্গ ও স্বদেশি আন্দোলন
summary:
  en: Rise of the Extremists, Lord Curzon's policies, the Partition of Bengal (1905), the Swadeshi and Boycott movement, national education, the Calcutta and Surat sessions, the Muslim League, the Morley-Minto Reforms (1909) and the annulment of the partition (1911).
  bn: চরমপন্থীদের উত্থান, লর্ড কার্জনের নীতি, বঙ্গভঙ্গ (১৯০৫), স্বদেশি ও বয়কট আন্দোলন, জাতীয় শিক্ষা, কলকাতা ও সুরাট অধিবেশন, মুসলিম লিগ, মর্লে-মিন্টো সংস্কার (১৯০৯) এবং বঙ্গভঙ্গ রদ (১৯১১)।
