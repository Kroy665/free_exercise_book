- id: q0015
  type: single
  difficulty: 2
  exams: [ssc-cgl, ibps-po, state-psc, wbcs, upsc-cse]
  refs: [pabna-deccan, british-response]
  stem:
    en: The agrarian league movement in Pabna (1873) prepared the ground for which law?
    bn: পাবনার কৃষক সংঘের আন্দোলন (১৮৭৩) কোন আইনের পথ প্রস্তুত করে?
  options:
    - { en: "Deccan Agriculturists' Relief Act, 1879", bn: "দাক্ষিণাত্য কৃষক ত্রাণ আইন, ১৮৭৯" }
    - { en: "Bengal Tenancy Act, 1885", bn: "বঙ্গীয় প্রজাস্বত্ব আইন, ১৮৮৫" }
    - { en: "Chotanagpur Tenancy Act, 1908", bn: "ছোটোনাগপুর প্রজাস্বত্ব আইন, ১৯০৮" }
    - { en: "Permanent Settlement, 1793", bn: "চিরস্থায়ী বন্দোবস্ত, ১৭৯৩" }
  answer: 1
  explanation:
    en: The Pabna struggle over rents and occupancy rights led to the Bengal Tenancy Act, 1885. The Deccan Agriculturists' Relief Act, 1879 is tempting because it also came from a peasant movement of the 1870s, but it followed the Deccan riots in the Bombay Presidency.
    bn: খাজনা ও দখলিস্বত্ব নিয়ে পাবনার সংগ্রাম বঙ্গীয় প্রজাস্বত্ব আইন, ১৮৮৫-এর পথ প্রস্তুত করে। দাক্ষিণাত্য কৃষক ত্রাণ আইন, ১৮৭৯-ও ১৮৭০-এর দশকের এক কৃষক আন্দোলনের ফল বলে বিভ্রান্তি হতে পারে, কিন্তু সেটি বোম্বাই প্রেসিডেন্সির দাক্ষিণাত্য হাঙ্গামার পরে আসে।
  status: ai-generated

- id: q0016
  type: assertion-reason
  difficulty: 3
  exams: [upsc-cse, state-psc, wbcs]
  refs: [kol-santhal, indigo]
  assertion:
    en: The Santhal Hul was directed against the dikus, that is, outsiders such as zamindars, moneylenders and traders.
    bn: সাঁওতাল হুল দিকু, অর্থাৎ জমিদার, মহাজন ও ব্যবসায়ীর মতো বহিরাগতদের বিরুদ্ধে পরিচালিত হয়েছিল।
  reason:
    en: Dinabandhu Mitra's play Nil Darpan exposed the oppression of indigo planters in Bengal.
    bn: দীনবন্ধু মিত্রের নাটক নীলদর্পণ বাংলায় নীলকরদের অত্যাচার তুলে ধরে।
  answer: 1
  explanation:
    en: Both statements are true, but the reason does not explain the assertion. Nil Darpan (1860) concerns indigo planters in Bengal, while the Hul (1855–56) arose from the exploitation of Santhals by outsiders in the Rajmahal hills.
    bn: দুটি বক্তব্যই সত্য, কিন্তু কারণটি বিবৃতির সঠিক ব্যাখ্যা নয়। নীলদর্পণ (১৮৬০) বাংলার নীলকরদের বিষয়ে, আর হুল (১৮৫৫–৫৬) হয়েছিল রাজমহল পাহাড় অঞ্চলে বহিরাগতদের হাতে সাঁওতালদের শোষণের ফলে।
  status: ai-generated

- id: q0017
  type: single
  difficulty: 2
  exams: [upsc-cse, state-psc, wbcs, ssc-cgl]
  refs: [munda]
  stem:
    en: The khuntkatti system of joint land ownership, which the Ulgulan sought to defend, belonged to which community?
    bn: উলগুলানের মাধ্যমে যে খুঁৎকাঠি যৌথ ভূমি মালিকানা ব্যবস্থা রক্ষার চেষ্টা হয়েছিল, তা কোন সম্প্রদায়ের ছিল?
  options:
    - { en: The Paikas of Odisha, bn: ওড়িশার পাইক }
    - { en: The peasants of the Bombay Deccan, bn: বোম্বাই দাক্ষিণাত্যের কৃষক }
    - { en: The Faraizis of eastern Bengal, bn: পূর্ববঙ্গের ফরাজি }
    - { en: The Mundas of Chotanagpur, bn: ছোটোনাগপুরের মুন্ডা }
  answer: 3
  explanation:
    en: Under khuntkatti, Munda land was owned jointly by the lineage that had cleared the forest. Its breakdown under outside jagirdars and thikadars was a key cause of Birsa Munda's Ulgulan, and the Chotanagpur Tenancy Act, 1908 later recognised these rights.
    bn: খুঁৎকাঠি ব্যবস্থায় যে গোষ্ঠী অরণ্য পরিষ্কার করেছিল, মুন্ডাদের জমির মালিক ছিল সেই গোষ্ঠী যৌথভাবে। বহিরাগত জায়গিরদার ও ঠিকাদারদের হাতে এই ব্যবস্থার ভাঙন বিরসা মুন্ডার উলগুলানের এক প্রধান কারণ; পরে ছোটোনাগপুর প্রজাস্বত্ব আইন, ১৯০৮ এই অধিকার স্বীকার করে।
  status: ai-generated

