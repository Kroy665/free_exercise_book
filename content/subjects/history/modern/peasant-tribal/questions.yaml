- id: q0010
  type: assertion-reason
  difficulty: 3
  exams: [upsc-cse, state-psc, wbcs]
  refs: [pabna-deccan, causes]
  assertion:
    en: The Deccan riots of 1875 were directed mainly against moneylenders rather than landlords.
    bn: ১৮৭৫ সালের দাক্ষিণাত্য হাঙ্গামার প্রধান লক্ষ্য ছিল জমিদাররা নয়, মহাজনরা।
  reason:
    en: Under the Ryotwari system of the Bombay Deccan, peasants paid revenue directly to the State, and those who fell into debt lost their land to moneylenders through the courts.
    bn: বোম্বাই দাক্ষিণাত্যের রায়তওয়ারি ব্যবস্থায় কৃষকরা সরাসরি রাষ্ট্রকে রাজস্ব দিত, এবং ঋণগ্রস্ত কৃষকরা আদালতের মাধ্যমে মহাজনদের হাতে জমি হারাত।
  answer: 0
  explanation:
    en: Both are true, and the reason explains the assertion. With no zamindar between peasant and State, the main oppressor the Deccan peasant faced was the moneylender who took his land for debt, so the rioters attacked moneylenders and burnt their debt bonds.
    bn: দুটি বক্তব্যই সত্য এবং কারণটি বিবৃতির সঠিক ব্যাখ্যা। কৃষক ও রাষ্ট্রের মধ্যে কোনো জমিদার না থাকায় দাক্ষিণাত্যের কৃষকের প্রধান শোষক ছিল ঋণের দায়ে জমি দখলকারী মহাজন; তাই বিদ্রোহীরা মহাজনদের আক্রমণ করে তাদের ঋণপত্র পুড়িয়ে দেয়।
  status: ai-generated

