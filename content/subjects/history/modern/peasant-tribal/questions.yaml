- id: q0013
  type: single
  difficulty: 2
  exams: [ssc-cgl, ssc-chsl, ibps-po, state-psc, wbcs]
  refs: [pabna-deccan]
  stem:
    en: The Deccan riots of 1875 were directed mainly against which group?
    bn: ১৮৭৫ সালের দাক্ষিণাত্য হাঙ্গামা প্রধানত কোন গোষ্ঠীর বিরুদ্ধে পরিচালিত হয়েছিল?
  options:
    - { en: European indigo planters, bn: ইউরোপীয় নীলকর }
    - { en: Zamindars, bn: জমিদার }
    - { en: Christian missionaries, bn: খ্রিস্টান মিশনারি }
    - { en: Moneylenders, bn: মহাজন }
  answer: 3
  explanation:
    en: Indebted peasants of Poona and Ahmednagar attacked moneylenders (sahukars) and burnt their debt bonds. Zamindars is the tempting answer, but the Bombay Deccan was under the Ryotwari system, where there were no zamindars between the peasant and the State.
    bn: পুনা ও আহমদনগরের ঋণগ্রস্ত কৃষকরা মহাজনদের (সাহুকার) আক্রমণ করে তাদের ঋণপত্র পুড়িয়ে দেয়। জমিদার উত্তরটি বিভ্রান্তিকর, কিন্তু বোম্বাই দাক্ষিণাত্যে রায়তওয়ারি ব্যবস্থা চালু ছিল, সেখানে কৃষক ও রাষ্ট্রের মধ্যে কোনো জমিদার ছিল না।
  status: ai-generated

