    bn: বঙ্কিমচন্দ্র চট্টোপাধ্যায়ের উপন্যাস "আনন্দমঠ" কোন বিদ্রোহের পটভূমিতে রচিত?
  options:
    - { en: The Indigo Revolt, bn: নীল বিদ্রোহ }
    - { en: The Santhal Hul, bn: সাঁওতাল হুল }
