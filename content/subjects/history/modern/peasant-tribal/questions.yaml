    bn: ফরাজি আন্দোলনের কেন্দ্র ছিল ফরিদপুর, পাইকরা খুরদার রাজার সৈনিক ছিল, দাক্ষিণাত্য হাঙ্গামা পুনা জেলার সুপা গ্রামে শুরু হয় এবং সাঁওতাল হুল ভগনাডিহিতে ঘোষিত হয়। বিদ্রোহের সূচনাস্থল হিসেবে সুপা ও ভগনাডিহিকেই সবচেয়ে বেশি গুলিয়ে ফেলা হয়।
