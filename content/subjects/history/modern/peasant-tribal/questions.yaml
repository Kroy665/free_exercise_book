    bn: পূর্ববঙ্গে ফরাজি আন্দোলন কে প্রতিষ্ঠা করেন?
  options:
    - { en: Syed Ahmad of Rae Bareli, bn: রায়বেরেলির সৈয়দ আহমদ }
    - { en: Haji Shariatullah, bn: হাজি শরিয়তউল্লাহ }
    - { en: Titu Mir, bn: তিতুমীর }
    - { en: Dudu Miyan, bn: দুদু মিয়াঁ }
  answer: 1
  explanation:
    en: Haji Shariatullah of Faridpur founded the Faraizi movement. Dudu Miyan was his son, who later turned it into an agrarian movement; Syed Ahmad and Titu Mir belong to the Wahabi tradition.
    bn: ফরিদপুরের হাজি শরিয়তউল্লাহ ফরাজি আন্দোলন প্রতিষ্ঠা করেন। দুদু মিয়াঁ ছিলেন তাঁর পুত্র, যিনি পরে একে কৃষক আন্দোলনে পরিণত করেন; সৈয়দ আহমদ ও তিতুমীর ওয়াহাবি ধারার সঙ্গে যুক্ত।
