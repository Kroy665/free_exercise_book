    - { en: "C. Deccan riots", bn: "গ. দাক্ষিণাত্য হাঙ্গামা" }
    - { en: "D. Santhal Hul", bn: "ঘ. সাঁওতাল হুল" }
  right:
    - { en: "1. Khurda", bn: "১. খুরদা" }
    - { en: "2. Supa", bn: "২. সুপা" }
