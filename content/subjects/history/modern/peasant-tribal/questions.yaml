    bn: আনন্দমঠ (১৮৮২), যাতে বন্দে মাতরম্ গানটি আছে, অষ্টাদশ শতকের শেষভাগে বাংলার সন্ন্যাসী-ফকির বিদ্রোহের পটভূমিতে রচিত। নীল বিদ্রোহও বাংলার আন্দোলন বলে বিভ্রান্তি হতে পারে, কিন্তু তার সঙ্গে যুক্ত বিখ্যাত সাহিত্যকর্ম হল দীনবন্ধু মিত্রের নীলদর্পণ।
