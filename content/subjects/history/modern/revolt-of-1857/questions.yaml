- id: q0001
  type: single
  difficulty: 1
  exams: [ssc-cgl, ssc-chsl, rrb-ntpc, wbcs]
  refs: [outbreak]
  stem:
    en: Where did the Revolt of 1857 begin on 10 May 1857?
    bn: ১৮৫৭ সালের ১০ মে কোথায় মহাবিদ্রোহের সূচনা হয়েছিল?
    hi: 10 मई 1857 को 1857 का विद्रोह कहाँ से प्रारंभ हुआ?
  options:
    - { en: Meerut, bn: মিরাট, hi: मेरठ }
    - { en: Delhi, bn: দিল্লি, hi: दिल्ली }
    - { en: Kanpur, bn: কানপুর, hi: कानपुर }
    - { en: Lucknow, bn: লখনউ, hi: लखनऊ }
  answer: 0
  explanation:
    en: Sepoys at Meerut revolted on 10 May 1857 and reached Delhi the next day. Barrackpore saw Mangal Pandey's act earlier (March 1857), but the general outbreak began at Meerut.
    bn: ১৮৫৭ সালের ১০ মে মিরাটের সিপাহিরা বিদ্রোহ করে এবং পরের দিন দিল্লি পৌঁছায়। এর আগে (মার্চ ১৮৫৭) ব্যারাকপুরে মঙ্গল পাণ্ডের ঘটনা ঘটলেও ব্যাপক বিদ্রোহের সূচনা হয় মিরাটে।
    hi: 10 मई 1857 को मेरठ के सिपाहियों ने विद्रोह किया और अगले दिन दिल्ली पहुँचे। बैरकपुर में मंगल पांडे की घटना पहले (मार्च 1857) हुई थी, परंतु व्यापक विद्रोह मेरठ से प्रारंभ हुआ।
  status: ai-generated

- id: q0002
  type: single
  difficulty: 1
  exams: [ssc-cgl, ssc-chsl, rrb-ntpc, state-psc, wbcs]
  refs: [background]
  stem:
    en: Who was the Governor-General of India during the Revolt of 1857?
    bn: ১৮৫৭ সালের মহাবিদ্রোহের সময় ভারতের গভর্নর-জেনারেল কে ছিলেন?
  options:
    - { en: Lord Dalhousie, bn: লর্ড ডালহৌসি }
    - { en: Lord Canning, bn: লর্ড ক্যানিং }
    - { en: Lord Elgin, bn: লর্ড এলগিন }
    - { en: Lord Lawrence, bn: লর্ড লরেন্স }
  answer: 1
  explanation:
    en: Lord Canning was Governor-General from 1856 and became the first Viceroy under the Government of India Act, 1858. Lord Dalhousie (1848–56) preceded him and is linked with the Doctrine of Lapse.
    bn: লর্ড ক্যানিং ১৮৫৬ সাল থেকে গভর্নর-জেনারেল ছিলেন এবং ১৮৫৮ সালের ভারত শাসন আইন অনুযায়ী প্রথম ভাইসরয় হন। তাঁর পূর্বসূরি লর্ড ডালহৌসি (১৮৪৮–৫৬) স্বত্ববিলোপ নীতির জন্য পরিচিত।
  status: ai-generated

