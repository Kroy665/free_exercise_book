- id: q0004
  type: statements
  difficulty: 2
  exams: [upsc-cse, state-psc, wbcs]
  refs: [consequences]
  stem:
    en: Consider the following statements about the Government of India Act, 1858.
    bn: ১৮৫৮ সালের ভারত শাসন আইন সম্পর্কে নিম্নলিখিত বিবৃতিগুলি বিবেচনা করুন।
  statements:
    - en: "1. It transferred the power to govern India from the East India Company to the British Crown."
      bn: "১. এই আইনের মাধ্যমে ভারত শাসনের ক্ষমতা ইস্ট ইন্ডিয়া কোম্পানির হাত থেকে ব্রিটিশ রাজশক্তির হাতে হস্তান্তরিত হয়।"
    - en: "2. It created the post of Secretary of State for India."
      bn: "২. এই আইনে ভারত-সচিব (Secretary of State for India) পদ সৃষ্টি করা হয়।"
    - en: "3. It abolished the Board of Control and the Court of Directors."
      bn: "৩. এই আইনে বোর্ড অব কন্ট্রোল ও কোর্ট অব ডিরেক্টরস বিলুপ্ত করা হয়।"
  question:
    en: Which of the statements given above is/are correct?
    bn: উপরের কোন বিবৃতিটি/বিবৃতিগুলি সঠিক?
  options:
    - { en: 1 and 2 only, bn: কেবল ১ ও ২ }
    - { en: 2 and 3 only, bn: কেবল ২ ও ৩ }
    - { en: 1 and 3 only, bn: কেবল ১ ও ৩ }
    - { en: "1, 2 and 3", bn: "১, ২ ও ৩" }
  answer: 3
  explanation:
    en: All three are correct. The Act ended Company rule, created a Secretary of State for India assisted by a 15-member Council of India, and abolished the Board of Control and the Court of Directors (ending the dual system of Pitt's India Act, 1784).
    bn: তিনটি বিবৃতিই সঠিক। এই আইন কোম্পানির শাসনের অবসান ঘটায়, ১৫ সদস্যের ভারত পরিষদ-সহ ভারত-সচিব পদ সৃষ্টি করে এবং বোর্ড অব কন্ট্রোল ও কোর্ট অব ডিরেক্টরস বিলুপ্ত করে। ফলে ১৭৮৪ সালের পিটের ভারত শাসন আইনের দ্বৈত শাসনব্যবস্থার অবসান ঘটে।
  status: ai-generated

- id: q0005
  type: assertion-reason
  difficulty: 3
  exams: [upsc-cse, state-psc, wbcs]
  refs: [causes]
  assertion:
    en: The annexation of Awadh in 1856 caused widespread discontent in the Bengal Army.
    bn: ১৮৫৬ সালে অযোধ্যা দখলের ফলে বেঙ্গল আর্মিতে ব্যাপক অসন্তোষ দেখা দেয়।
  reason:
    en: A large number of sepoys of the Bengal Army were recruited from Awadh.
    bn: বেঙ্গল আর্মির বহু সিপাহি অযোধ্যা থেকে নিযুক্ত হয়েছিলেন।
  answer: 0
  explanation:
    en: Both are true, and the reason explains the assertion. Many Bengal Army sepoys came from Awadh, so its annexation and the hardship it caused to their families and to the taluqdars affected them directly.
    bn: দুটি বক্তব্যই সত্য এবং কারণটি বিবৃতির সঠিক ব্যাখ্যা। বেঙ্গল আর্মির বহু সিপাহি অযোধ্যার বাসিন্দা ছিলেন, তাই অযোধ্যা দখল এবং তার ফলে তাঁদের পরিবার ও তালুকদারদের দুর্দশা তাঁদের সরাসরি প্রভাবিত করে।
  status: ai-generated

- id: q0006
  type: chronology
  difficulty: 2
  exams: [upsc-cse, ssc-cgl, state-psc, wbcs]
  refs: [outbreak, consequences, causes]
  stem:
    en: Arrange the following events in chronological order.
    bn: নিম্নলিখিত ঘটনাগুলিকে কালানুক্রমিকভাবে সাজান।
  items:
    - en: "1. Queen Victoria's Proclamation at Allahabad"
      bn: "১. এলাহাবাদে মহারানি ভিক্টোরিয়ার ঘোষণাপত্র"
    - en: "2. Annexation of Awadh"
      bn: "২. অযোধ্যা দখল"
    - en: "3. Outbreak of the revolt at Meerut"
      bn: "৩. মিরাটে বিদ্রোহের সূচনা"
    - en: "4. Mangal Pandey's attack on officers at Barrackpore"
      bn: "৪. ব্যারাকপুরে মঙ্গল পাণ্ডের ব্রিটিশ অফিসারদের আক্রমণ"
