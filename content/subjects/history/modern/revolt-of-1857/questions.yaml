- id: q0007
  type: single
  difficulty: 2
  exams: [ssc-cgl, upsc-cse, state-psc, wbcs]
  refs: [causes]
  stem:
    en: Which one of the following was **NOT** annexed under the Doctrine of Lapse?
    bn: নিম্নলিখিত কোনটি স্বত্ববিলোপ নীতি অনুযায়ী দখল করা **হয়নি**?
  options:
    - { en: Satara, bn: সাতারা }
    - { en: Nagpur, bn: নাগপুর }
    - { en: Awadh, bn: অযোধ্যা }
    - { en: Jhansi, bn: ঝাঁসি }
  answer: 2
  explanation:
    en: Awadh was annexed in 1856 on grounds of alleged misgovernance. Satara (1848), Jhansi (1853) and Nagpur (1854) were annexed under Dalhousie's Doctrine of Lapse.
    bn: ১৮৫৬ সালে কুশাসনের অভিযোগে অযোধ্যা দখল করা হয়। সাতারা (১৮৪৮), ঝাঁসি (১৮৫৩) ও নাগপুর (১৮৫৪) ডালহৌসির স্বত্ববিলোপ নীতি অনুযায়ী দখল করা হয়েছিল।
  status: ai-generated

- id: q0008
  type: single
  difficulty: 1
  exams: [ssc-cgl, ssc-chsl, rrb-ntpc, state-psc, wbcs]
  refs: [nature]
  stem:
    en: Who wrote the book "The Indian War of Independence" (1909) about the Revolt of 1857?
    bn: ১৮৫৭ সালের বিদ্রোহ সম্পর্কে "দ্য ইন্ডিয়ান ওয়ার অব ইন্ডিপেনডেন্স" (১৯০৯) গ্রন্থটি কে রচনা করেন?
  options:
    - { en: R.C. Majumdar, bn: রমেশচন্দ্র মজুমদার }
    - { en: S.N. Sen, bn: সুরেন্দ্রনাথ সেন }
    - { en: Bipan Chandra, bn: বিপান চন্দ্র }
    - { en: V.D. Savarkar, bn: বিনায়ক দামোদর সাভারকর }
  answer: 3
  explanation:
    en: V.D. Savarkar called the revolt a planned war of national independence. R.C. Majumdar held the opposite view, calling it neither the first, nor national, nor a war of independence.
    bn: বিনায়ক দামোদর সাভারকর এই বিদ্রোহকে পরিকল্পিত জাতীয় স্বাধীনতা যুদ্ধ বলে অভিহিত করেন। রমেশচন্দ্র মজুমদার এর বিপরীত মত পোষণ করতেন; তাঁর মতে এটি প্রথম নয়, জাতীয় নয়, স্বাধীনতা যুদ্ধও নয়।
  status: ai-generated

