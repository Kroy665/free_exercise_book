    bn: ১৬০৫ সালে অন্ধ্র উপকূলের মসুলিপট্টমে প্রথম ওলন্দাজ কুঠি স্থাপিত হয়। পুলিকট পরে করমণ্ডল উপকূলে ওলন্দাজদের প্রধান কেন্দ্র হয়ে উঠেছিল বলে বিভ্রান্তি হয়, কিন্তু সেটি প্রথম কুঠি ছিল না।
