- id: q0010
  type: single
  difficulty: 2
  exams: [ssc-cgl, rrb-ntpc, state-psc, wbcs, upsc-cse]
  refs: [english, portuguese]
  stem:
    en: How did Bombay first come into English hands?
    bn: বোম্বাই প্রথম কীভাবে ইংরেজদের হাতে আসে?
  options:
    - { en: It was bought from the Mughal emperor Aurangzeb, bn: মুঘল সম্রাট ঔরঙ্গজেবের কাছ থেকে কেনা হয় }
    - { en: It was granted by the Sultan of Bijapur, bn: বিজাপুরের সুলতান তা দান করেন }
    - { en: It was part of the dowry when Catherine of Braganza married Charles II, bn: ক্যাথরিন অব ব্রাগাঞ্জার সঙ্গে দ্বিতীয় চার্লসের বিবাহে যৌতুক হিসেবে }
    - { en: It was captured from the Dutch after the Battle of Bedara, bn: বেদারার যুদ্ধের পর ওলন্দাজদের কাছ থেকে দখল করা হয় }
  answer: 2
  explanation:
    en: In 1661 the Portuguese gave Bombay to Charles II as part of Catherine of Braganza's dowry; he leased it to the Company in 1668 for £10 a year. Bedara (1759) was a defeat of the Dutch in Bengal and had nothing to do with Bombay.
    bn: ১৬৬১ সালে ক্যাথরিন অব ব্রাগাঞ্জার যৌতুক হিসেবে পোর্তুগিজরা বোম্বাই দ্বিতীয় চার্লসকে দেয়; তিনি ১৬৬৮ সালে বছরে ১০ পাউন্ড খাজনায় তা কোম্পানিকে ইজারা দেন। বেদারার যুদ্ধ (১৭৫৯) ছিল বাংলায় ওলন্দাজদের পরাজয়, বোম্বাইয়ের সঙ্গে এর কোনো সম্পর্ক নেই।
