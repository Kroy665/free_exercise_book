    bn: ১৭৬০ সালের ২২ জানুয়ারি বন্দিবাসের যুদ্ধে স্যার আয়ার কুট ফরাসি সেনাপতি কাউন্ট দ্য লালিকে পরাজিত করেন। রবার্ট ক্লাইভের নাম যুক্ত দ্বিতীয় কর্ণাটকের যুদ্ধে আর্কট (১৭৫১) এবং পলাশির (১৭৫৭) সঙ্গে, বন্দিবাসের সঙ্গে নয়।
