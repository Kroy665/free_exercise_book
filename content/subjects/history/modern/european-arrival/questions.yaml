  options:
    - { en: A pass that Asian merchant ships had to buy from the Portuguese, bn: পোর্তুগিজদের কাছ থেকে এশীয় বাণিজ্যতরিগুলিকে কিনতে হওয়া একটি অনুমতিপত্র }
    - { en: A land grant made by the Mughals to the Portuguese, bn: মুঘলদের দ্বারা পোর্তুগিজদের দেওয়া একটি ভূমিদান }
    - { en: A fortified Portuguese warehouse on the coast, bn: উপকূলে পোর্তুগিজদের একটি সুরক্ষিত গুদাম }
