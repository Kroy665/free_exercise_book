  stem:
    en: The French East India Company was formed in 1664 at the initiative of which French minister?
    bn: কোন ফরাসি মন্ত্রীর উদ্যোগে ১৬৬৪ সালে ফরাসি ইস্ট ইন্ডিয়া কোম্পানি গঠিত হয়েছিল?
  options:
    - { en: Dupleix, bn: ডুপ্লে }
