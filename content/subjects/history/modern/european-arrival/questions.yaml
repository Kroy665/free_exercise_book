  answer: 2
  explanation:
    en: The company was set up in 1664, during the reign of Louis XIV, at the initiative of his minister Colbert. François Martin founded Pondicherry in 1674, and Dupleix became its governor only in 1742.
    bn: চতুর্দশ লুইয়ের রাজত্বকালে তাঁর মন্ত্রী কোলবেয়ারের উদ্যোগে ১৬৬৪ সালে কোম্পানিটি গঠিত হয়। ফ্রাঁসোয়া মার্তাঁ ১৬৭৪ সালে পন্ডিচেরি প্রতিষ্ঠা করেন, আর ডুপ্লে সেখানকার গভর্নর হন অনেক পরে, ১৭৪২ সালে।
