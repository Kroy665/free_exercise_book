id: hist.modern.revolutionaries
title:
  en: Revolutionary Nationalism
  bn: বিপ্লবী জাতীয়তাবাদ
summary:
  en: Secret societies and revolutionary groups in India and abroad, from the Chapekar brothers, Anushilan Samiti and Jugantar through the Ghadar Party to the HRA, the HSRA of Bhagat Singh and the Chittagong Armoury Raid, with an assessment of their role.
  bn: চাপেকর ভ্রাতৃদ্বয়, অনুশীলন সমিতি ও যুগান্তর থেকে গদর পার্টি, হিন্দুস্তান রিপাবলিকান অ্যাসোসিয়েশন, ভগৎ সিংয়ের হিন্দুস্তান সোশ্যালিস্ট রিপাবলিকান অ্যাসোসিয়েশন এবং চট্টগ্রাম অস্ত্রাগার লুণ্ঠন পর্যন্ত দেশে ও বিদেশে বিপ্লবী গোষ্ঠীগুলির কার্যকলাপ ও তাদের ভূমিকার মূল্যায়ন।
