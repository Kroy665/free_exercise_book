    bn: ১৯১৩ সালে প্রশান্ত মহাসাগরীয় উপকূলের ভারতীয় অভিবাসীরা, যাঁদের অধিকাংশ পাঞ্জাবি, গদর পার্টি গঠন করেন; এর সদর দফতর ছিল সানফ্রান্সিসকোতে। কোমাগাতা মারুর ঘটনার (১৯১৪) জন্য ভ্যাঙ্কুভার বিভ্রান্তিকর মনে হতে পারে, কিন্তু দলের সদর দফতর যুগান্তর আশ্রম ছিল সানফ্রান্সিসকোতে।
