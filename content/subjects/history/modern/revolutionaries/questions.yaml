    bn: সূর্য সেন (মাস্টারদা) ইন্ডিয়ান রিপাবলিকান আর্মি, চট্টগ্রাম শাখার নেতৃত্ব দেন; এই গোষ্ঠী ১৯৩০ সালের ১৮ এপ্রিল চট্টগ্রামের অস্ত্রাগার দখল করে। যতীন্দ্রনাথ মুখোপাধ্যায় (বাঘা যতীন) এর অনেক আগে, ১৯১৫ সালে, মারা যান।
