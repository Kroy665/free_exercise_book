  stem:
    en: The killing of J.P. Saunders at Lahore in December 1928 was meant to avenge the death of which leader?
    bn: ১৯২৮ সালের ডিসেম্বরে লাহোরে জে. পি. স্যান্ডার্সকে হত্যা কোন নেতার মৃত্যুর প্রতিশোধ হিসেবে পরিকল্পিত হয়েছিল?
  options:
    - { en: Jatin Das, bn: যতীন দাস }
