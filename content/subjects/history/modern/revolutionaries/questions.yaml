    en: Which official was shot dead by Benoy, Badal and Dinesh in the Writers' Building on 8 December 1930?
    bn: ১৯৩০ সালের ৮ ডিসেম্বর রাইটার্স বিল্ডিংয়ে বিনয়, বাদল ও দীনেশ কোন কর্মকর্তাকে গুলি করে হত্যা করেন?
  options:
    - { en: Sir Stanley Jackson, bn: স্যার স্ট্যানলি জ্যাকসন }
    - { en: Douglas Kingsford, bn: ডগলাস কিংসফোর্ড }
    - { en: Lt. Col. N.S. Simpson, bn: লেফটেন্যান্ট কর্নেল এন. এস. সিম্পসন }
    - { en: J.P. Saunders, bn: জে. পি. স্যান্ডার্স }
