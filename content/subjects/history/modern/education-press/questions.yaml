  options:
    - { en: University of Calcutta, bn: কলকাতা বিশ্ববিদ্যালয় }
    - { en: University of Bombay, bn: বোম্বাই বিশ্ববিদ্যালয় }
    - { en: University of Madras, bn: মাদ্রাজ বিশ্ববিদ্যালয় }
    - { en: University of Allahabad, bn: এলাহাবাদ বিশ্ববিদ্যালয় }
  answer: 3
