    en: Who is known as the "liberator of the Indian press"?
    bn: কাকে "ভারতীয় সংবাদপত্রের মুক্তিদাতা" বলা হয়?
  options:
    - { en: Sir Charles Metcalfe, bn: স্যার চার্লস মেটকাফ }
    - { en: Lord Ripon, bn: লর্ড রিপন }
    - { en: John Adam, bn: জন অ্যাডাম }
    - { en: Lord William Bentinck, bn: লর্ড উইলিয়াম বেন্টিঙ্ক }
  answer: 0
  explanation:
    en: As acting Governor-General, Sir Charles Metcalfe passed the Press Act of 1835, which repealed the restrictive Licensing Regulations of 1823. Lord Ripon repealed the Vernacular Press Act in 1882 but is not given this title; John Adam imposed the 1823 restrictions.
    bn: অস্থায়ী গভর্নর-জেনারেল হিসেবে স্যার চার্লস মেটকাফ ১৮৩৫ সালের সংবাদপত্র আইন পাস করেন, যা ১৮২৩ সালের কঠোর লাইসেন্সিং রেগুলেশন বাতিল করে। লর্ড রিপন ১৮৮২ সালে দেশীয় ভাষা সংবাদপত্র আইন প্রত্যাহার করলেও এই উপাধি তাঁর নয়; জন অ্যাডাম ১৮২৩ সালের বিধিনিষেধ আরোপ করেছিলেন।
  status: ai-generated

