    en: Which newspaper changed from Bengali to English almost overnight to escape the Vernacular Press Act of 1878?
    bn: ১৮৭৮ সালের দেশীয় ভাষা সংবাদপত্র আইন এড়াতে কোন সংবাদপত্র প্রায় রাতারাতি বাংলা থেকে ইংরেজিতে রূপান্তরিত হয়?
  options:
    - { en: The Bengalee, bn: দ্য বেঙ্গলি }
    - { en: Bangadarshan, bn: বঙ্গদর্শন }
    - { en: Amrita Bazar Patrika, bn: অমৃতবাজার পত্রিকা }
