- id: q0003
  type: single
  difficulty: 1
  exams: [ssc-cgl, ssc-chsl, rrb-ntpc, ibps-po, state-psc, wbcs]
  refs: [woods-despatch]
  stem:
    en: Which document is known as the "Magna Carta of English Education in India"?
    bn: কোন নথিকে "ভারতে ইংরেজি শিক্ষার ম্যাগনা কার্টা" বলা হয়?
  options:
    - { en: "Charter Act of 1813", bn: "১৮১৩ সালের সনদ আইন" }
    - { en: Macaulay's Minute, bn: মেকলে মিনিট }
    - { en: Report of the Hunter Commission, bn: হান্টার কমিশনের প্রতিবেদন }
    - { en: Wood's Despatch, bn: উডের ডেসপ্যাচ }
  answer: 3
  explanation:
    en: Wood's Despatch of 1854 laid down a complete scheme of education from primary school to university for the first time, so it is called the Magna Carta of English Education in India. Macaulay's Minute (1835) settled the medium of instruction but did not give such a complete plan.
    bn: ১৮৫৪ সালের উডের ডেসপ্যাচ প্রথমবার প্রাথমিক বিদ্যালয় থেকে বিশ্ববিদ্যালয় পর্যন্ত শিক্ষার পূর্ণাঙ্গ পরিকল্পনা দেয়, তাই একে ভারতে ইংরেজি শিক্ষার ম্যাগনা কার্টা বলা হয়। মেকলে মিনিট (১৮৩৫) শিক্ষার মাধ্যম স্থির করেছিল, কিন্তু এমন পূর্ণাঙ্গ পরিকল্পনা দেয়নি।
  status: ai-generated

