  stem:
    en: The Indian Universities Act of 1904 was based on the recommendations of which body?
    bn: ১৯০৪ সালের ভারতীয় বিশ্ববিদ্যালয় আইন কোন সংস্থার সুপারিশের ভিত্তিতে তৈরি হয়?
  options:
