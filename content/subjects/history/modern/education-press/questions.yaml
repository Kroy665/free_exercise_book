  exams: [ssc-cgl, ssc-chsl, rrb-ntpc, ibps-po, state-psc, wbcs]
  refs: [early-press]
  stem:
    en: Who started The Bengal Gazette in 1780, regarded as the first newspaper published in India?
    bn: ভারতে প্রকাশিত প্রথম সংবাদপত্র হিসেবে গণ্য বেঙ্গল গেজেট ১৭৮০ সালে কে প্রকাশ করেন?
  options:
    - { en: Raja Rammohun Roy, bn: রাজা রামমোহন রায় }
    - { en: William Carey, bn: উইলিয়াম কেরি }
    - { en: James Augustus Hicky, bn: জেমস অগাস্টাস হিকি }
    - { en: Charles Metcalfe, bn: চার্লস মেটকাফ }
  answer: 2
  explanation:
    en: James Augustus Hicky started The Bengal Gazette (Calcutta General Advertiser) in 1780. Rammohun Roy's papers came much later, in 1821 and 1822.
    bn: জেমস অগাস্টাস হিকি ১৭৮০ সালে বেঙ্গল গেজেট (ক্যালকাটা জেনারেল অ্যাডভার্টাইজার) প্রকাশ করেন। রামমোহন রায়ের পত্রিকাগুলি এসেছিল অনেক পরে, ১৮২১ ও ১৮২২ সালে।
  status: ai-generated

