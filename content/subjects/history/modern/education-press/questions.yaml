    - { en: Raleigh Commission, bn: র‍্যালে কমিশন }
  answer: 3
  explanation:
    en: Lord Curzon appointed the Universities Commission under Sir Thomas Raleigh in 1902, and the 1904 Act followed its recommendations. The Hunter Commission (1882) dealt mainly with primary and secondary education.
    bn: লর্ড কার্জন ১৯০২ সালে স্যার টমাস র‍্যালের নেতৃত্বে বিশ্ববিদ্যালয় কমিশন নিয়োগ করেন, এবং ১৯০৪ সালের আইন তার সুপারিশ অনুসরণ করে। হান্টার কমিশন (১৮৮২) মূলত প্রাথমিক ও মাধ্যমিক শিক্ষা নিয়ে কাজ করেছিল।
