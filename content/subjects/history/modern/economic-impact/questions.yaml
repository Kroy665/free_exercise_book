- id: q0005
  type: assertion-reason
  difficulty: 3
  exams: [upsc-cse, state-psc, wbcs]
  refs: [permanent-settlement]
  assertion:
    en: In the long run, the Permanent Settlement prevented the state from sharing in the rising income from agriculture in Bengal.
    bn: দীর্ঘমেয়াদে চিরস্থায়ী বন্দোবস্তের ফলে বাংলায় কৃষি থেকে ক্রমবর্ধমান আয়ের ভাগ রাষ্ট্র পায়নি।
  reason:
    en: Under the Permanent Settlement, the revenue demand on the zamindars was fixed permanently.
    bn: চিরস্থায়ী বন্দোবস্তে জমিদারদের দেয় রাজস্বের পরিমাণ চিরকালের জন্য নির্দিষ্ট করে দেওয়া হয়েছিল।
  answer: 0
  explanation:
    en: Both are true, and the reason explains the assertion. Because the state's demand could never be raised, the extra income from expanding cultivation went to the zamindars, not the government. This is also why later settlements were made temporary.
    bn: দুটি বক্তব্যই সত্য এবং কারণটি বিবৃতির সঠিক ব্যাখ্যা। রাষ্ট্রের প্রাপ্য কখনও বাড়ানো যেত না বলে চাষের প্রসারে বাড়তি আয় জমিদারদের হাতে যেত, সরকারের হাতে নয়। এই কারণেই পরবর্তী বন্দোবস্তগুলি অস্থায়ী করা হয়।
  status: ai-generated

