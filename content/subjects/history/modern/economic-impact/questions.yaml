    bn: আলেকজান্ডার রিডের সঙ্গে টমাস মনরো মাদ্রাজের রায়তওয়ারি বন্দোবস্তের সঙ্গে যুক্ত। হোল্ট ম্যাকেঞ্জি মহলওয়ারি বন্দোবস্তের (১৮২২) প্রস্তাব দেন, আর জন শোর ও কর্নওয়ালিস চিরস্থায়ী বন্দোবস্তের সঙ্গে যুক্ত।
