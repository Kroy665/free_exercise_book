- id: q0007
  type: chronology
  difficulty: 2
  exams: [upsc-cse, state-psc, wbcs]
  refs: [permanent-settlement, ryotwari-mahalwari]
  stem:
    en: Arrange the following land revenue arrangements in chronological order.
    bn: নিম্নলিখিত ভূমিরাজস্ব ব্যবস্থাগুলিকে কালানুক্রমিকভাবে সাজান।
  items:
    - en: "1. Permanent Settlement in Bengal"
      bn: "১. বাংলায় চিরস্থায়ী বন্দোবস্ত"
    - en: "2. Panchsala (five-year) settlement of Warren Hastings"
      bn: "২. ওয়ারেন হেস্টিংসের পাঁচসালা বন্দোবস্ত"
    - en: "3. Mahalwari system proposed by Holt Mackenzie"
      bn: "৩. হোল্ট ম্যাকেঞ্জির প্রস্তাবিত মহলওয়ারি বন্দোবস্ত"
    - en: "4. Decennial (ten-year) settlement in Bengal"
      bn: "৪. বাংলায় দশসালা বন্দোবস্ত"
  options:
    - { en: 2-4-1-3, bn: ২-৪-১-৩ }
    - { en: 4-2-1-3, bn: ৪-২-১-৩ }
    - { en: 2-1-4-3, bn: ২-১-৪-৩ }
    - { en: 2-4-3-1, bn: ২-৪-৩-১ }
  answer: 0
  explanation:
    en: The Panchsala settlement came in 1772, the decennial settlement in 1790, the Permanent Settlement in 1793 and the Mahalwari proposal in 1822. The decennial settlement came before the Permanent Settlement, because it was the arrangement that was declared permanent in 1793.
    bn: পাঁচসালা বন্দোবস্ত ১৭৭২ সালে, দশসালা বন্দোবস্ত ১৭৯০ সালে, চিরস্থায়ী বন্দোবস্ত ১৭৯৩ সালে এবং মহলওয়ারি প্রস্তাব ১৮২২ সালে। দশসালা বন্দোবস্ত চিরস্থায়ী বন্দোবস্তের আগে, কারণ ১৭৯৩ সালে সেটিকেই চিরস্থায়ী ঘোষণা করা হয়।
  status: ai-generated

- id: q0008
  type: single
  difficulty: 2
  exams: [ssc-cgl, state-psc, wbcs]
  refs: [permanent-settlement]
  stem:
    en: Under the Sunset Law of the Permanent Settlement, what happened if a zamindar failed to pay the fixed revenue by sunset on the due date?
    bn: চিরস্থায়ী বন্দোবস্তের সূর্যাস্ত আইন অনুযায়ী নির্দিষ্ট দিনে সূর্যাস্তের মধ্যে জমিদার ধার্য রাজস্ব জমা দিতে না পারলে কী হত?
  options:
    - { en: His revenue demand was raised for the next year, bn: পরের বছরের জন্য তাঁর রাজস্বের পরিমাণ বাড়ানো হত }
    - { en: His land was handed over to the ryots, bn: তাঁর জমি রায়তদের হাতে তুলে দেওয়া হত }
    - { en: His estate was sold by auction, bn: তাঁর জমিদারি নিলামে বিক্রি করা হত }
    - { en: He lost the right to collect rent for one year, bn: এক বছরের জন্য তিনি খাজনা আদায়ের অধিকার হারাতেন }
  answer: 2
  explanation:
    en: Under the Sunset Law, an estate whose revenue was not paid by sunset on the due date was liable to be sold by auction, and many old zamindari families lost their lands this way. The revenue demand itself could never be raised, so the first option is wrong.
    bn: সূর্যাস্ত আইন অনুযায়ী নির্দিষ্ট দিনে সূর্যাস্তের মধ্যে রাজস্ব জমা না পড়লে জমিদারি নিলামে বিক্রি করা হত; এভাবে বহু পুরোনো জমিদার পরিবার জমি হারায়। রাজস্বের পরিমাণ কখনও বাড়ানো যেত না, তাই প্রথম বিকল্পটি ভুল।
  status: ai-generated

