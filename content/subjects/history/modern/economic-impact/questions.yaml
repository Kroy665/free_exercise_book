    - { en: Lord Cornwallis, bn: লর্ড কর্নওয়ালিস }
    - { en: Lord Wellesley, bn: লর্ড ওয়েলেসলি }
    - { en: Lord Dalhousie, bn: লর্ড ডালহৌসি }
  answer: 1
  explanation:
    en: Lord Cornwallis introduced the Permanent Settlement in 1793 in Bengal, Bihar and Orissa. Warren Hastings is linked with the earlier five-year (Panchsala) settlement of 1772, not the Permanent Settlement.
    bn: লর্ড কর্নওয়ালিস ১৭৯৩ সালে বাংলা, বিহার ও ওড়িশায় চিরস্থায়ী বন্দোবস্ত চালু করেন। ওয়ারেন হেস্টিংস এর আগের ১৭৭২ সালের পাঁচসালা বন্দোবস্তের সঙ্গে যুক্ত, চিরস্থায়ী বন্দোবস্তের সঙ্গে নয়।
  status: ai-generated

