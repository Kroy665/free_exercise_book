  stem:
    en: Which event led to the formation of the Sadharan Brahmo Samaj in 1878?
    bn: কোন ঘটনার ফলে ১৮৭৮ সালে সাধারণ ব্রাহ্মসমাজ গঠিত হয়?
  options:
    - { en: The death of Raja Rammohun Roy in England, bn: ইংল্যান্ডে রাজা রামমোহন রায়ের মৃত্যু }
    - { en: The founding of the Tattvabodhini Sabha, bn: তত্ত্ববোধিনী সভার প্রতিষ্ঠা }
    - { en: The passing of the Hindu Widows' Remarriage Act, bn: হিন্দু বিধবা পুনর্বিবাহ আইন পাস হওয়া }
    - { en: "Keshab Chandra Sen's marriage of his under-age daughter to the Maharaja of Cooch Behar", bn: কেশবচন্দ্র সেনের নাবালিকা কন্যার সঙ্গে কোচবিহারের মহারাজার বিবাহ }
