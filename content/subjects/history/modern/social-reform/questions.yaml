    bn: ১৮৭৮ সালে কেশবচন্দ্র তাঁর নাবালিকা কন্যার সঙ্গে কোচবিহারের মহারাজার বিবাহ দেন, যা তাঁরই প্রচারিত ১৮৭২ সালের আইনের নিয়মের বিরোধী ছিল। ফলে বহু অনুগামী সরে গিয়ে সাধারণ ব্রাহ্মসমাজ গঠন করেন। তত্ত্ববোধিনী সভা (১৮৩৯) অনেক আগে প্রতিষ্ঠিত হয় এবং কোনো বিভাজনের সঙ্গে যুক্ত নয়।
