    - { en: The Indian League, bn: ইন্ডিয়ান লিগ }
    - { en: The Indian Association, bn: ভারত সভা }
    - { en: The Bengal British India Society, bn: বেঙ্গল ব্রিটিশ ইন্ডিয়া সোসাইটি }
