    en: The British Indian Association (1851) was formed by the merger of the Landholders' Society and which other body?
    bn: জমিদার সভা ও অন্য কোন সংগঠন মিলিত হয়ে ব্রিটিশ ইন্ডিয়ান অ্যাসোসিয়েশন (১৮৫১) গঠিত হয়?
