id: hist.modern.early-nationalism
title:
  en: Rise of Nationalism and the Moderates
  bn: জাতীয়তাবাদের উত্থান ও নরমপন্থীরা
summary:
  en: Factors behind modern Indian nationalism, pre-Congress associations, the Ilbert Bill controversy, the founding and early sessions of the Indian National Congress, the Moderates' leaders, methods and demands, the Indian Councils Act 1892 and an assessment of the Moderate phase.
  bn: আধুনিক ভারতীয় জাতীয়তাবাদের উত্থানের কারণ, কংগ্রেস-পূর্ব রাজনৈতিক সংগঠন, ইলবার্ট বিল বিতর্ক, ভারতীয় জাতীয় কংগ্রেসের প্রতিষ্ঠা ও প্রথম দিকের অধিবেশন, নরমপন্থী নেতৃবৃন্দ, তাঁদের পদ্ধতি ও দাবি, ১৮৯২ সালের ভারতীয় পরিষদ আইন এবং নরমপন্থী পর্বের মূল্যায়ন।
