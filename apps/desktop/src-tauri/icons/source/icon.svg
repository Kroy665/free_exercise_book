<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Free Exercise Book app icon. Source of truth: regenerate PNG/ICNS/ICO with
       `npm run icons` (see apps/desktop/package.json). License: CC BY-SA 4.0. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E74C9"/>
      <stop offset="1" stop-color="#174A8C"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEF6"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEF6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B2547" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Rounded-square tile (macOS grid: 824px tile centred in 1024) -->
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- Amber cover peeking below the pages -->
    <path d="M512 404 C 438 362 300 352 214 378 L 214 742 C 300 718 438 726 512 770
             C 586 726 724 718 810 742 L 810 378 C 724 352 586 362 512 404 Z" fill="#F2B035"/>
    <!-- Left page -->
    <path d="M512 372 C 440 330 318 320 236 344 L 236 708 C 318 684 440 694 512 736 Z" fill="url(#pageL)"/>
    <!-- Right page -->
    <path d="M512 372 C 584 330 706 320 788 344 L 788 708 C 706 684 584 694 512 736 Z" fill="url(#pageR)"/>
    <!-- Spine -->
    <path d="M512 372 L 512 736" stroke="#C9D3E3" stroke-width="6"/>
  </g>

  <!-- Left page: notes -->
  <g stroke="#9CB6D9" stroke-width="20" stroke-linecap="round">
    <line x1="292" y1="436" x2="458" y2="440"/>
    <line x1="292" y1="500" x2="458" y2="504"/>
    <line x1="292" y1="564" x2="420" y2="567"/>
    <line x1="292" y1="628" x2="446" y2="632"/>
  </g>

  <!-- Right page: MCQ options, the middle one answered correctly -->
  <g stroke="#9CB6D9" stroke-width="20" stroke-linecap="round" fill="none">
    <circle cx="590" cy="440" r="22" stroke-width="12"/>
    <line x1="638" y1="440" x2="734" y2="437"/>
    <line x1="638" y1="534" x2="734" y2="531"/>
    <circle cx="590" cy="628" r="22" stroke-width="12"/>
    <line x1="638" y1="628" x2="712" y2="626"/>
  </g>
  <circle cx="590" cy="534" r="34" fill="#1E9E5A"/>
  <path d="M572 535 L 585 549 L 609 521" fill="none" stroke="#FFFFFF" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
