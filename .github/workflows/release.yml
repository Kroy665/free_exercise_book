# Build installers for all platforms when a version tag is pushed (e.g. v0.1.0).
# Creates a *draft* GitHub Release; a maintainer reviews and publishes it.
# Code signing / notarization and updater signing are not configured yet (docs/SPEC.md §7).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            rust-targets: ""
            args: ""
          - name: Windows x64
            os: windows-latest
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Cached: the first run downloads the .debs, later runs restore them in seconds.
      # (The Azure Ubuntu mirror can be very slow; see CI run 42198775762.)
      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libwebkit2gtk-4.1-dev librsvg2-dev patchelf
          version: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Free Exercise Book ${{ github.ref_name }}"
          releaseBody: |
            Pre-alpha build. Installers are not code-signed yet:
            - Windows: SmartScreen may warn — choose "More info → Run anyway".
            - macOS: right-click the app → Open the first time.
            See README.md for details.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
