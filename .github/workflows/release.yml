# Build installers for all platforms when a version tag is pushed (e.g. v0.1.0).
# Creates a *draft* GitHub Release; a maintainer reviews and publishes it.
# Code signing / notarization and updater signing are not configured yet (docs/SPEC.md §7).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Linux x64
            os: ubuntu-24.04
            rust-targets: ""
            args: ""
          - name: Windows x64
            os: windows-latest
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # --no-install-recommends skips ~100 optional packages (PipeWire, portals, …) that slow
      # downloads from the Azure apt mirror; retries + timeout guard against a slow mirror.
      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          # The runner's default Azure apt mirror is intermittently very slow (≈60 KB/s);
          # use Canonical's archive instead.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Free Exercise Book ${{ github.ref_name }}"
          releaseBody: |
            Pre-alpha build. Installers are not code-signed yet:
            - Windows: SmartScreen may warn — choose "More info → Run anyway".
            - macOS: right-click the app → Open the first time.
            See README.md for details.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  # Publish SHA-256 checksums of every installer (docs/INSTALL.md "Verify your download").
  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download release assets and upload SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" --skip-existing
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
