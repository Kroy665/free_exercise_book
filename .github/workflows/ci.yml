# CI — docs/CODING_GUIDELINES.md §5
name: CI

# Manual only (Actions minutes are limited): run from the Actions tab or
# `gh workflow run CI -R Kroy665/free_exercise_book`. Run the same checks locally first
# (README → Development).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"

jobs:
  # Content: schemas, anchors, en/bn completeness, Bengali digit rules.
  content:
    name: Content validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema
      - run: python3 tools/content-check/validate.py content

  # Frontend: svelte-check (TypeScript + a11y) and production build.
  frontend:
    name: Frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Rust: fmt, clippy and tests on all three desktop platforms.
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # --no-install-recommends skips ~100 optional packages (PipeWire, portals, …) that slow
      # downloads from the Azure apt mirror; retries + timeout guard against a slow mirror.
      - name: Install Linux system dependencies (Tauri)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          # The runner's default Azure apt mirror is intermittently very slow (≈60 KB/s);
          # use Canonical's archive instead.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends \
            -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
            libwebkit2gtk-4.1-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The Tauri crate embeds the built frontend, so build it before compiling.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      # The app bundles dist/packs; CI signs them with a throwaway development key.
      - name: Build content packs (development key)
        run: cargo run -q -p feb-packer -- build content --out dist/packs --dev-key dist/dev-key

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        run: cargo test --workspace --locked

  # Licenses (GPL-3.0 compatible) and security advisories.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources
